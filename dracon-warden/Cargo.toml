[package]
license = "AGPL-3.0-only"
name = "dracon-warden"
version = "0.1.1"
edition = "2021"

[dependencies]
age = "0.10"
anyhow = "1.0"
chrono = "0.4"
comfy-table = "7"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
hostname = "0.4"
# notify = "6.1" # Removed - daemon deprecated, hooks are primary security layer
rand = "0.8"
secrecy = "0.8"
zeroize = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"
dirs = "6.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }
dracon-security-kit = { package = "dracon-security", path = "src/security" }

[dev-dependencies]
tempfile = "3"
