# bunfig.toml — Dracon utilities meta repo
#
# [test] root points the test runner at the application whose suite this repo's
# verification contracts actually assert. Without it, `bun test <filter>` run
# from this directory searches only this repo, which holds no `src/` at all, and
# bun exits 1 with "the following filters did not match any test files" — a
# failure that says nothing about the code under test.
#
# Why a meta repo needs it: the books suite lives in a SIBLING repository
# (dracon-platform/web/books), not a nested checkout, so from here it is
# reached as a relative path out of this repo: ../dracon-platform/web/books.
# Contracts that assert on it are executed from this repo's working directory,
# so the runner has to be told where the suite is.
#
# FIXED 2026-10-09 (audit F132): this used to be the absolute machine path
# /home/dracon/Dev/dracon-platform/web/books, which made the file
# machine-specific — any clone without that exact path got the very `bun test`
# failure the header described. A relative root is resolved by bun against the
# directory holding this bunfig.toml (verified with bun 1.3.14: relative to the
# config file, NOT the caller's cwd), so it is portable across clones for as
# long as the sibling checkout sits next to this repo. If the sibling is absent
# the runner has nothing to find either way — that is a missing prerequisite,
# not something a hardcoded home directory can fix.
#
# FIXED 2026-10-09 (audit F140): the root was the whole books package,
# which selects MORE than the suite this header describes. The parity claim
# below was false by 25 tests / 8 files: bun collected the sibling's
# scripts/*.test.ts suites as well, and two of those are currently red inside
# the sibling repo (cover-repair-manifest, reconciliation-manifest — verified
# red from the sibling's own cwd, so they are pre-existing there, not caused
# by running them from here). A discovery root that drags an unrelated repo's
# broken suites into this repo's gate makes the gate permanently red for
# failures this repo cannot fix. The root is pinned to src/lib so the
# documented parity is literally true, and the count below is the measured one.
#
# This is a discovery root only — it does not change assertions, fixtures or
# exit semantics. The suite it selects must be green on its own merits; that it
# now is, is a property of the code, not of this file. A contract run through
# here executes the same 8,066 tests and honours the same exit code as
# `cd dracon-platform/web/books && bun test src/lib` (measured 2026-10-09:
# 8066 pass / 0 fail / 25 files both ways).
#
# The tests this selects resolve their fixtures from the module under test
# (new URL(rel, import.meta.url)) rather than process.cwd(), which is what makes
# them safe to run from a different working directory. Any test added to that
# suite must follow the same rule, or it will pass locally and fail here.
[test]
root = "../dracon-platform/web/books/src/lib"
