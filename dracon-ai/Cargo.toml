[package]
name = "dracon-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
dirs = "6.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustyline = "14.0"
toml = "0.8"

# AI runtime is owned by dracon-libs; dracon-ai is a thin CLI consumer.
ai-runtime-config = { path = "../../dracon-libs/platform/crates/ai-runtime-config" }
ai-routing-runtime = { path = "../../dracon-libs/platform/crates/ai-routing-runtime" }
ai-runtime-adapters = { path = "../../dracon-libs/platform/crates/ai-runtime-adapters" }
dracon-ai-contracts = { path = "../../dracon-libs/domains/crates/dracon-ai-contracts" }
dracon-ai-runtime-contracts = { path = "../../dracon-libs/domains/crates/dracon-ai-runtime-contracts" }
