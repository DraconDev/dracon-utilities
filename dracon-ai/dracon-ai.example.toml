# Dracon AI Configuration
# Path: ~/.dracon/utilities/ai/dracon-ai.toml
#
# Controls AI behavior for interactive sessions and tool execution.

# System repository root (for context-aware operations)
# system_root = "/home/dracon/dracon"

# NixOS configuration root (for Nix-specific tasks)
# nixos_root = "/home/dracon/dracon/nixos"

# Auto-probe NixOS context when task mentions Nix/NixOS
# do_auto_probe_nix = false

# Environment variables that control behavior:
# DRACON_AI_APPLY=0         - Plan-only mode (don't execute commands)
# DRACON_AI_DANGEROUS=1     - Allow dangerous commands (use with caution)
# DRACON_AI_ALLOW_CMD=1     - Enable /cmd tool execution in REPL
# DRACON_AI_CONFIG=<path>   - Override config file location
