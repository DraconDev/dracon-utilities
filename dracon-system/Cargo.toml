[package]
name = "dracon-system"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
dracon-system-lib = { package = "dracon-system", path = "../dracon-libs/tools/crates/dracon-system" }
