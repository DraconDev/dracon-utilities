[package]
name = "dracon-system"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
chrono = "0.4"
dracon-system-lib = { path = "../../dracon-libs/tools/system/dracon-system" }
