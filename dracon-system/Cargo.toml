[package]
name = "dracon-system"
version = "0.2.4"
edition = "2021"
license = "AGPL-3.0-only"
description = "Disk, process, storage, and service diagnostics for local development machines"
readme = "README.md"
repository = "https://github.com/DraconDev/dracon-utilities"
homepage = "https://github.com/DraconDev/dracon-utilities"
documentation = "https://docs.rs/dracon-system"
keywords = ["disk", "process", "service", "diagnostics", "doctor"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "*.md", "!README.md", "Cargo.lock", "target/"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["full"] }
walkdir = { workspace = true }
chrono = { workspace = true }
comfy-table = { workspace = true }
dracon-system-lib = { workspace = true }
