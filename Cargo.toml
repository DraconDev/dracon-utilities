[workspace]
# CHANGED 2026-07-21 (v0.112.32, audit H9/F4.2): the security crate
# (dracon-warden/src/security) is now a full workspace MEMBER and
# dracon-warden depends on it BY PATH. Previously dracon-warden built
# the published crates.io dracon-security v0.3.0, so fixes to the
# local source never reached the warden binary — the H9 whole-file
# binary-smudge fix lives in that source. Membership also means
# `cargo test --workspace --locked` (AGENTS.md test discipline) runs
# the security crate's tests.
members = [
    "dracon-sync",
    "dracon-system",
    "dracon-warden",
    "dracon-warden/src/security",
]
resolver = "2"

# LOCAL PATCH (2026-07-18): pull dracon-git v94.7.1 from the operator's
# DraconDev/dracon-libs git repo at the tagged release v94.7.1 instead of
# crates.io v94.7.0. The crates.io version uses libgit2 + Cred::ssh_key_from_agent
# which requires a running ssh-agent and fails with "unsupported URL protocol;
# class=Net (12)" in wezterm/NixOS sessions that have no ssh-agent. v94.7.1 adds a
# CLI primary path for `fetch()` that respects `~/.ssh/config` and works without an
# agent.
#
# Fix: see docs/design/concerns-investigation-2026-07-18.md §F5.
# This patch should be removed once v94.7.1 is published to crates.io
# (requires operator's CARGO_REGISTRY_TOKEN), at which point
# dracon-sync/Cargo.toml should bump `dracon-git` from "94.7.0" to "94.7.1".
[patch.crates-io]
dracon-git = { git = "https://github.com/DraconDev/dracon-libs", tag = "v94.7.1" }

# Workspace-level package metadata. Each crate's own [package] block
# overrides these on a per-crate basis. This file exists so that
# AGENTS.md test discipline commands (`cargo build --release --locked`,
# `cargo test --workspace --locked`) work from the monorepo root, as
# documented in README.md ("Or install all 3 from the monorepo ... cargo build --release").
#
# See AUDIT-3-UTILITIES-2026-07-10.md CONCERN #5.
#
# NOTE: workspace.dependencies is intentionally NOT defined. The three
# crates have diverging dep versions (e.g. rayon 1.12 vs 1.13, anyhow
# 1.0.103 vs 1.0.103, etc.) and locking them would force a single
# version across the workspace, which would either break the
# `cargo install` from crates.io (which resolves each crate's own
# Cargo.toml independently) or break cargo deny (which expects the
# per-crate deny.toml + Cargo.lock to be authoritative). The crates
# remain independently buildable and publishable; the workspace
# manifest only enables the AGENTS.md monorepo-root commands.

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"

# Profile tuning shared across all members. Release builds use LTO
# + single codegen unit so the daemon binaries match what `cargo
# install --path` produces per-crate.
[profile.release]
lto = "thin"
codegen-units = 1