[workspace]
members = [
    "dracon-sync",
    "dracon-system",
    "dracon-warden",
]
exclude = [
    "dracon-ai",
]
resolver = "2"

[workspace.package]
version = "0.112.4"
edition = "2021"
authors = ["DraconDev"]

[profile.release]
strip = true
lto = "thin"

[workspace.dependencies]
age = "0.10"
ai-routing-runtime = { path = "../dracon-libs/services/crates/ai/ai-routing-runtime" }
ai-runtime-adapters = { path = "../dracon-libs/services/crates/ai/ai-runtime-adapters" }
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7"
dirs = "6.0"
dracon-ai-runtime-contracts = { path = "../dracon-libs/contracts/crates/ai/dracon-ai-runtime-contracts" }
dracon-git = { path = "../dracon-libs/tools/sync/dracon-git" }
dracon-security-kit = { package = "dracon-security", path = "dracon-warden/src/security" }
dracon-system-lib = { path = "../dracon-libs/tools/system/dracon-system" }
env_logger = "0.10"
fs2 = "0.4"
futures = "0.3"
globset = "0.4"
hostname = "0.4"
log = "0.4"
notify-rust = "4.17"
parking_lot = "0.12"
proptest = "1"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rustyline = "14.0"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
toml = "0.8"
urlencoding = "2"
walkdir = "2"
zeroize = "1"
