[workspace]
members = [
    "dracon-sync",
    "dracon-system",
    "dracon-warden",
    # "dracon-ai",  # requires dracon-libs/services/ai which is not yet available
]
resolver = "2"

[workspace.package]
version = "0.56.1"
edition = "2021"
authors = ["DraconDev"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
toml = "0.8"
tempfile = "3"
chrono = "0.4"
walkdir = "2"
