[[slices]]
id = "docs-discovery-01"
intent = "Scan the repository for existing documentation files and list their locations."
actions = [
  "find . -maxdepth 3 -type f -name '*.md' | head -20",
  "ls -la | grep -iE 'readme|doc|guide'"
]
verifiers = [
  "test -d . || echo 'Root check passed'"
]
conformance_verifiers = []
metric_verifiers = []
depends_on = []
max_retries = 2
checkpoint = "A list of potential documentation files and directories has been generated."
