[package]
name = "dracon-sync"
version = "0.1.3"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
ai-adapters = { path = "../../dracon-libs/services/ai/ai-adapters", default-features = false }
ai-routing-service = { path = "../../dracon-libs/services/ai/ai-routing-service" }
ai-router = { path = "../../dracon-libs/services/ai/ai-router" }
toml = "0.8"
walkdir = "2.5"

dracon-git = { path = "../../dracon-libs/tools/sync/dracon-git" }
dracon-common = { path = "../../dracon-libs/tools/common/dracon-common", features = ["test-support"] }
fs2 = "0.4"

[features]
default = ["scribe"]
scribe = []
