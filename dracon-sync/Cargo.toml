[package]
name = "dracon-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
walkdir = "2.5"
dracon-git = { path = "../../dracon-libs/tools/crates/dracon-git" }
dracon-protocols = { path = "../../dracon-libs/domains/crates/dracon-protocols" }
