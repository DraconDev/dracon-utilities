[package]
name = "dracon-sync"
version = "0.1.3"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
walkdir = "2.5"
dracon-git = { path = "../../dracon-libs/tools/sync/dracon-git" }
fs2 = "0.4"
notify-rust = "4"

[features]
default = ["scribe", "ai-bumper"]
scribe = []
ai-bumper = []
