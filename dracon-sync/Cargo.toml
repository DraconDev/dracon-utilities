[package]
name = "dracon-sync"
version = "0.1.3"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"
walkdir = "2.5"
dracon-git = { path = "../../dracon-libs/tools/sync/dracon-git" }
dracon-common = { path = "../../dracon-libs/tools/common/dracon-common", features = ["test-support"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
ai-runtime-adapters = { path = "../../dracon-libs/services/crates/ai/ai-runtime-adapters", default-features = false, features = ["config-only"], optional = true }

[features]
default = ["scribe"]
scribe = ["dep:reqwest", "dep:ai-runtime-adapters"]
