[package]
name = "dracon-sync"
version = "0.1.4"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "signal"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
toml = "0.8"
dracon-git = { path = "../../dracon-libs/tools/sync/dracon-git" }
notify-rust = "4"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"

[features]
default = ["scribe", "ai-bumper"]
scribe = []
ai-bumper = []
