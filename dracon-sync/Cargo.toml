[package]
name = "dracon-sync"
version = "0.1.9"
edition = "2021"
license = "AGPL-3.0-only"
description = "Invisible git sync daemon for deterministic AI-assisted development"
readme = "README.md"
repository = "https://github.com/DraconDev/dracon-utilities"
homepage = "https://github.com/DraconDev/dracon-utilities"
documentation = "https://docs.rs/dracon-sync"
keywords = ["git", "sync", "daemon", "auto-commit", "multi-remote"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/", "*.md", "!README.md", "Cargo.lock", "target/"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
comfy-table = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
dracon-git = { workspace = true }
notify-rust = { workspace = true }
parking_lot = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = []
