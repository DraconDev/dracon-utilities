ress":[],"length":0,"stats":{"Line":0}},{"line":587,"address":[],"length":0,"stats":{"Line":0}},{"line":588,"address":[],"length":0,"stats":{"Line":0}},{"line":589,"address":[],"length":0,"stats":{"Line":0}}],"covered":30,"coverable":266},{"path":["/","home","dracon","Dev","dracon-utilities","dracon-sync","src","git.rs"],"content":"use anyhow::{Context, Result};\nuse dracon_git::{\n    types::{DiffFile, FileStatus, RepoStatus},\n    GitService,\n};\nuse std::collections::{BTreeMap, BTreeSet};\nuse std::path::{Path, PathBuf};\nuse std::process::Command as StdCommand;\nuse std::time::Duration;\nuse tokio::process::Command as TokioCommand;\nuse tokio::time::sleep;\n\nuse crate::exclude::{can_restore_entry, is_excluded_change_path, is_large_untracked, should_stage_entry};\nuse crate::policy::{git_binary, std_git_command, tokio_git_command, timestamp_secs};\n\npub(crate) fn discover_git_repos(\n    roots: \u0026[PathBuf],\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n    exclude_repos: \u0026[String],\n) -\u003e Vec\u003cPathBuf\u003e {\n    let exclude_set: std::collections::HashSet\u003cPathBuf\u003e =\n        exclude_repos.iter().map(PathBuf::from).collect();\n    let mut repos = Vec::new();\n    for root in roots {\n        discover_git_repos_recursive(root, excluded_dir_names, \u0026mut repos, 0, 2);\n    }\n    repos.retain(|r| !exclude_set.contains(r));\n    repos\n}\n\nfn discover_git_repos_recursive(\n    dir: \u0026Path,\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n    repos: \u0026mut Vec\u003cPathBuf\u003e,\n    depth: usize,\n    max_depth: usize,\n) {\n    if depth \u003e max_depth {\n        return;\n    }\n    if let Ok(entries) = std::fs::read_dir(dir) {\n        for entry in entries.filter_map(|e| e.ok()) {\n            let path = entry.path();\n            if !path.is_dir() || path.is_symlink() {\n                continue;\n            }\n            let name = path.file_name().unwrap_or_default().to_string_lossy().to_string();\n            // Skip excluded dirs (from policy) and safety-net heavy directories\n            // not covered by defaults or hidden-dir filtering.\n            if excluded_dir_names.contains(\u0026name)\n                || name == \"vendor\"\n                || name == \"objects\"\n            {\n                continue;\n            }\n            // Skip hidden dirs (covers .git, .next, .cache, .venv, __pycache__, etc.)\n            if name.starts_with('.') {\n                continue;\n            }\n            if path.join(\".git\").exists() {\n                repos.push(path.clone());\n            }\n            // Recurse into subdirectories\n            discover_git_repos_recursive(\u0026path, excluded_dir_names, repos, depth + 1, max_depth);\n        }\n    }\n}\n\npub(crate) fn has_origin_remote(repo: \u0026Path) -\u003e bool {\n    let config_path = repo.join(\".git\").join(\"config\");\n    if let Ok(config) = std::fs::read_to_string(\u0026config_path) {\n        return config.lines().any(|line| line.trim() == \"[remote \\\"origin\\\"]\");\n    }\n    std_git_command()\n        .arg(\"remote\")\n        .arg(\"get-url\")\n        .arg(\"origin\")\n        .current_dir(repo)\n        .output()\n        .map(|o| o.status.success())\n        .unwrap_or(false)\n}\n\npub(crate) fn has_tracking_upstream(repo: \u0026Path) -\u003e bool {\n    let config_path = repo.join(\".git\").join(\"config\");\n    if let Ok(config) = std::fs::read_to_string(\u0026config_path) {\n        if let Some(branch) = current_branch(repo) {\n            let section = format!(\"[branch \\\"{}\\\"]\", branch);\n            if let Some(pos) = config.find(\u0026section) {\n                let after = \u0026config[pos + section.len()..];\n                let next_section = after.find('[').unwrap_or(after.len());\n                let branch_config = \u0026after[..next_section];\n                return branch_config.contains(\"remote = \") \u0026\u0026 branch_config.contains(\"merge = \");\n            }\n        }\n        return false;\n    }\n    // Config file not readable (worktree, symlink, etc.) —\n    // fall back to git subprocess which handles these cases natively.\n    std_git_command()\n        .args([\"rev-parse\", \"--abbrev-ref\", \"--symbolic-full-name\", \"@{u}\"])\n        .current_dir(repo)\n        .output()\n        .map(|o| o.status.success())\n        .unwrap_or(false)\n}\n\npub(crate) fn is_rebase_in_progress(repo: \u0026Path) -\u003e bool {\n    repo.join(\".git\").join(\"rebase-merge\").exists()\n        || repo.join(\".git\").join(\"rebase-apply\").exists()\n}\n\npub(crate) fn is_merge_in_progress(repo: \u0026Path) -\u003e bool {\n    repo.join(\".git\").join(\"MERGE_HEAD\").exists()\n}\n\npub(crate) fn is_cherry_pick_in_progress(repo: \u0026Path) -\u003e bool {\n    repo.join(\".git\").join(\"CHERRY_PICK_HEAD\").exists()\n}\n\npub(crate) async fn kill_descendants(pid: u32) {\n    let pid_s = pid.to_string();\n    let _ = TokioCommand::new(\"pkill\")\n        .args([\"-TERM\", \"-P\", \u0026pid_s])\n        .output()\n        .await;\n    tokio::time::sleep(Duration::from_millis(200)).await;\n    let _ = TokioCommand::new(\"pkill\")\n        .args([\"-KILL\", \"-P\", \u0026pid_s])\n        .output()\n        .await;\n}\n\npub(crate) async fn run_child(\n    mut child: tokio::process::Child,\n    workdir: \u0026Path,\n    timeout_secs: u64,\n    label: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let pid = child.id();\n    match tokio::time::timeout(Duration::from_secs(timeout_secs), child.wait()).await {\n        Ok(Ok(status)) =\u003e {\n            if status.success() {\n                Ok(())\n            } else {\n                Err(anyhow::anyhow!(\n                    \"{} failed in {} with status {}\",\n                    label,\n                    workdir.display(),\n                    status\n                ))\n            }\n        }\n        Ok(Err(e)) =\u003e Err(anyhow::anyhow!(\n            \"{} failed in {}: {}\",\n            label,\n            workdir.display(),\n            e\n        )),\n        Err(_) =\u003e {\n            if let Some(pid) = pid {\n                kill_descendants(pid).await;\n            }\n            let _ = child.start_kill();\n            let _ = child.wait().await;\n            Err(anyhow::anyhow!(\n                \"{} timeout in {} after {}s\",\n                label,\n                workdir.display(),\n                timeout_secs\n            ))\n        }\n    }\n}\n\npub(crate) async fn run_git_with_timeout(\n    repo: \u0026Path,\n    args: \u0026[\u0026str],\n    timeout_secs: u64,\n    op_label: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let label = format!(\"git {}\", op_label);\n    let child = tokio_git_command()\n        .args(args)\n        .current_dir(repo)\n        .kill_on_drop(true)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::piped())\n        .spawn()\n        .with_context(|| format!(\"failed to spawn {} in {}\", label, repo.display()))?;\n    run_child(child, repo, timeout_secs, \u0026label).await\n}\n\npub(crate) async fn run_git_with_timeout_env(\n    repo: \u0026Path,\n    args: \u0026[\u0026str],\n    timeout_secs: u64,\n    op_label: \u0026str,\n    env: \u0026[(\u0026str, \u0026str)],\n) -\u003e Result\u003c()\u003e {\n    let label = format!(\"git {}\", op_label);\n    let mut cmd = tokio_git_command();\n    cmd.args(args)\n        .current_dir(repo)\n        .kill_on_drop(true)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::piped());\n    for (k, v) in env {\n        cmd.env(k, v);\n    }\n    let child = cmd\n        .spawn()\n        .with_context(|| format!(\"failed to spawn {} in {}\", label, repo.display()))?;\n    run_child(child, repo, timeout_secs, \u0026label).await\n}\n\npub(crate) async fn run_cmd_with_timeout(\n    repo: \u0026Path,\n    program: \u0026str,\n    args: \u0026[\u0026str],\n    timeout_secs: u64,\n    op_label: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let label = format!(\"{} {}\", program, op_label);\n    let child = TokioCommand::new(program)\n        .args(args)\n        .current_dir(repo)\n        .kill_on_drop(true)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::piped())\n        .spawn()\n        .with_context(|| format!(\"failed to spawn {} in {}\", label, repo.display()))?;\n    run_child(child, repo, timeout_secs, \u0026label).await\n}\n\npub(crate) fn origin_url(repo: \u0026Path) -\u003e Option\u003cString\u003e {\n    let out = std_git_command()\n        .args([\"remote\", \"get-url\", \"origin\"])\n        .current_dir(repo)\n        .output()\n        .ok()?;\n    if !out.status.success() {\n        return None;\n    }\n    let url = String::from_utf8_lossy(\u0026out.stdout).trim().to_string();\n    if url.is_empty() {\n        None\n    } else {\n        Some(url)\n    }\n}\n\npub(crate) fn strip_url_credentials(url: \u0026str) -\u003e String {\n    if let Some(stripped) = url.strip_prefix(\"https://\") {\n        if let Some(at_pos) = stripped.find('@') {\n            return format!(\"https://{}\", \u0026stripped[at_pos + 1..]);\n        }\n    }\n    url.to_string()\n}\n\npub(crate) fn github_https_url(origin: \u0026str) -\u003e Option\u003cString\u003e {\n    if let Some(rest) = origin.strip_prefix(\"git@github.com:\") {\n        return Some(format!(\"https://github.com/{}\", rest));\n    }\n    if let Some(rest) = origin.strip_prefix(\"ssh://git@github.com/\") {\n        return Some(format!(\"https://github.com/{}\", rest));\n    }\n    if origin.starts_with(\"https://github.com/\") {\n        return Some(strip_url_credentials(origin));\n    }\n    None\n}\n\npub(crate) async fn push_with_transport_fallbacks(\n    repo: \u0026Path,\n    timeout_secs: u64,\n    op_label: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let ssh_hardening = \"ssh -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2\";\n    match run_git_with_timeout_env(\n        repo,\n        \u0026[\"push\", \"origin\", \"HEAD\"],\n        timeout_secs,\n        \u0026format!(\"{op_label}-ssh-hardened\"),\n        \u0026[(\"GIT_SSH_COMMAND\", ssh_hardening)],\n    )\n    .await\n    {\n        Ok(()) =\u003e return Ok(()),\n        Err(e) =\u003e {\n            let origin = origin_url(repo).unwrap_or_default();\n            if let Some(https) = github_https_url(\u0026origin) {\n                let branch = current_branch(repo).unwrap_or_else(|| \"master\".to_string());\n                let refspec = format!(\"HEAD:refs/heads/{branch}\");\n                run_git_with_timeout(\n                    repo,\n                    \u0026[\"push\", \u0026https, \u0026refspec],\n                    timeout_secs,\n                    \u0026format!(\"{op_label}-https-fallback\"),\n                )\n                .await\n                .with_context(|| format!(\"ssh fallback failed first: {}\", e))\n            } else {\n                Err(e)\n            }\n        }\n    }\n}\n\npub(crate) async fn push_with_retries(\n    repo: \u0026Path,\n    timeout_secs: u64,\n    retries: u32,\n    op_label: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let attempts = retries.max(1);\n    let mut last_err: Option\u003canyhow::Error\u003e = None;\n    let mut timeout_seen = false;\n    for attempt in 1..=attempts {\n        match run_git_with_timeout(repo, \u0026[\"push\", \"origin\", \"HEAD\"], timeout_secs, op_label).await\n        {\n            Ok(()) =\u003e return Ok(()),\n            Err(e) =\u003e {\n                let err_text = e.to_string();\n                let is_timeout = err_text.contains(\"timeout\");\n                timeout_seen |= is_timeout;\n                last_err = Some(e);\n                if attempt \u003c attempts \u0026\u0026 is_timeout {\n                    let backoff = (attempt as u64).min(5);\n                    eprintln!(\n                        \"⏱️ push retry {}/{} for {} after {}s\",\n                        attempt + 1,\n                        attempts,\n                        repo.display(),\n                        backoff\n                    );\n                    sleep(Duration::from_secs(backoff)).await;\n                    continue;\n                }\n                break;\n            }\n        }\n    }\n    if timeout_seen {\n        if let Ok(()) = push_with_transport_fallbacks(repo, timeout_secs, op_label).await {\n            return Ok(());\n        }\n    }\n    Err(last_err.unwrap_or_else(|| anyhow::anyhow!(\"push failed\")))\n}\n\npub(crate) fn run_git_capture_output(repo: \u0026Path, args: \u0026[\u0026str], op_label: \u0026str) -\u003e Result\u003cString\u003e {\n    let output = std_git_command()\n        .args(args)\n        .current_dir(repo)\n        .output()\n        .with_context(|| format!(\"failed to run git {} in {}\", op_label, repo.display()))?;\n    let mut text = String::new();\n    text.push_str(\u0026String::from_utf8_lossy(\u0026output.stdout));\n    text.push_str(\u0026String::from_utf8_lossy(\u0026output.stderr));\n    Ok(text)\n}\n\npub(crate) async fn git_list_paths(repo: \u0026Path, args: \u0026[\u0026str]) -\u003e Result\u003cVec\u003cPathBuf\u003e\u003e {\n    let output = tokio_git_command()\n        .args(args)\n        .current_dir(repo)\n        .output()\n        .await\n        .with_context(|| format!(\"failed to run git {:?} in {}\", args, repo.display()))?;\n    if !output.status.success() {\n        return Ok(Vec::new());\n    }\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    Ok(stdout\n        .lines()\n        .map(str::trim)\n        .filter(|l| !l.is_empty())\n        .map(PathBuf::from)\n        .collect())\n}\n\npub(crate) fn parse_name_status_line(line: \u0026str) -\u003e Option\u003c(PathBuf, FileStatus)\u003e {\n    let mut parts = line.split('\\t');\n    let status_raw = parts.next()?.trim();\n    if status_raw.is_empty() {\n        return None;\n    }\n    let status_char = status_raw.chars().next()?;\n    let (path, status) = match status_char {\n        'M' =\u003e (parts.next()?, FileStatus::Modified),\n        'A' =\u003e (parts.next()?, FileStatus::Added),\n        'D' =\u003e (parts.next()?, FileStatus::Deleted),\n        'T' =\u003e (parts.next()?, FileStatus::TypeChange),\n        'R' =\u003e {\n            let _old = parts.next()?;\n            let new = parts.next()?;\n            (new, FileStatus::Renamed)\n        }\n        _ =\u003e return None,\n    };\n    Some((PathBuf::from(path.trim()), status))\n}\n\npub(crate) async fn git_name_status_entries(\n    repo: \u0026Path,\n    args: \u0026[\u0026str],\n) -\u003e Result\u003cVec\u003c(PathBuf, FileStatus)\u003e\u003e {\n    let output = tokio_git_command()\n        .args(args)\n        .current_dir(repo)\n        .output()\n        .await\n        .with_context(|| format!(\"failed to run git {:?} in {}\", args, repo.display()))?;\n    if !output.status.success() {\n        return Ok(Vec::new());\n    }\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    Ok(stdout\n        .lines()\n        .filter_map(parse_name_status_line)\n        .collect::\u003cVec\u003c_\u003e\u003e())\n}\n\npub(crate) fn fallback_status_rank(status: \u0026FileStatus) -\u003e u8 {\n    match status {\n        FileStatus::Deleted =\u003e 5,\n        FileStatus::Renamed =\u003e 4,\n        FileStatus::TypeChange =\u003e 3,\n        FileStatus::Added =\u003e 2,\n        FileStatus::Modified =\u003e 1,\n        FileStatus::Unknown =\u003e 0,\n    }\n}\n\npub(crate) async fn cli_diff_entries(repo: \u0026Path) -\u003e Result\u003cVec\u003cDiffFile\u003e\u003e {\n    let mut entries: BTreeMap\u003cPathBuf, FileStatus\u003e = BTreeMap::new();\n\n    for args in [\n        \u0026[\"diff\", \"--name-status\"][..],\n        \u0026[\"diff\", \"--cached\", \"--name-status\"][..],\n    ] {\n        for (path, status) in git_name_status_entries(repo, args).await? {\n            let should_replace = entries\n                .get(\u0026path)\n                .map(|old| fallback_status_rank(\u0026status) \u003e= fallback_status_rank(old))\n                .unwrap_or(true);\n            if should_replace {\n                entries.insert(path, status);\n            }\n        }\n    }\n\n    for path in git_list_paths(repo, \u0026[\"ls-files\", \"--others\", \"--exclude-standard\"]).await? {\n        let should_replace = entries\n            .get(\u0026path)\n            .map(|old| fallback_status_rank(\u0026FileStatus::Added) \u003e= fallback_status_rank(old))\n            .unwrap_or(true);\n        if should_replace {\n            entries.insert(path, FileStatus::Added);\n        }\n    }\n\n    Ok(entries\n        .into_iter()\n        .map(|(path, status)| DiffFile {\n            path,\n            status,\n        })\n        .collect())\n}\n\npub(crate) async fn repo_diff_entries(repo: \u0026Path) -\u003e Result\u003cVec\u003cDiffFile\u003e\u003e {\n    let svc = GitService::new(repo)?;\n    let mut entries = svc.get_diff_entries().await?;\n    if entries.is_empty() {\n        let fallback_entries = cli_diff_entries(repo).await?;\n        if !fallback_entries.is_empty() {\n            entries = fallback_entries;\n        }\n    }\n    Ok(entries)\n}\n\npub(crate) async fn staged_paths(repo: \u0026Path) -\u003e Result\u003cVec\u003cPathBuf\u003e\u003e {\n    git_list_paths(repo, \u0026[\"diff\", \"--cached\", \"--name-only\"]).await\n}\n\npub(crate) async fn unstage_excluded_paths(\n    repo: \u0026Path,\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n) -\u003e Result\u003cusize\u003e {\n    let staged = staged_paths(repo).await?;\n    let mut to_unstage = Vec::new();\n    for path in staged {\n        if is_excluded_change_path(\u0026path, excluded_dir_names) {\n            to_unstage.push(path);\n        }\n    }\n    if to_unstage.is_empty() {\n        return Ok(0);\n    }\n\n    let removed = to_unstage.len();\n    // Batch in groups of 50 to avoid too long command lines\n    for chunk in to_unstage.chunks(50) {\n        let mut cmd = tokio_git_command();\n        cmd.args([\"reset\", \"-q\", \"HEAD\", \"--\"])\n            .current_dir(repo)\n            .kill_on_drop(true);\n        for path in chunk {\n            cmd.arg(path);\n        }\n        let status = cmd.status()\n            .await\n            .with_context(|| {\n                format!(\"failed to unstage paths in {}\", repo.display())\n            })?;\n        if !status.success() {\n            // If one chunk fails, it might be due to a specific path error.\n            // Just log it and continue with other chunks.\n            eprintln!(\"⚠️ failed to unstage a chunk of paths in {}\", repo.display());\n        }\n    }\n    Ok(removed)\n}\n\npub(crate) async fn unstage_oversized_paths(repo: \u0026Path, max_stage_file_bytes: u64) -\u003e Result\u003cusize\u003e {\n    let staged = staged_paths(repo).await?;\n    let mut to_unstage = Vec::new();\n    for path in staged {\n        let full = repo.join(\u0026path);\n        let meta = match std::fs::metadata(\u0026full) {\n            Ok(m) =\u003e m,\n            Err(_) =\u003e continue,\n        };\n        if !meta.is_file() || meta.len() \u003c= max_stage_file_bytes {\n            continue;\n        }\n        to_unstage.push(path);\n    }\n    if to_unstage.is_empty() {\n        return Ok(0);\n    }\n\n    let removed = to_unstage.len();\n    for chunk in to_unstage.chunks(50) {\n        let mut cmd = tokio_git_command();\n        cmd.args([\"reset\", \"-q\", \"HEAD\", \"--\"])\n            .current_dir(repo)\n            .kill_on_drop(true);\n        for path in chunk {\n            cmd.arg(path);\n        }\n        let status = cmd.status()\n            .await\n            .with_context(|| {\n                format!(\"failed to unstage oversized paths in {}\", repo.display())\n            })?;\n        if !status.success() {\n            eprintln!(\"⚠️ failed to unstage a chunk of oversized paths in {}\", repo.display());\n        }\n    }\n    Ok(removed)\n}\n\npub(crate) fn current_branch(repo: \u0026Path) -\u003e Option\u003cString\u003e {\n    let head_path = repo.join(\".git\").join(\"HEAD\");\n    if let Ok(content) = std::fs::read_to_string(\u0026head_path) {\n        let trimmed = content.trim();\n        if let Some(ref_name) = trimmed.strip_prefix(\"ref: refs/heads/\") {\n            return Some(ref_name.to_string());\n        }\n    }\n    std_git_command()\n        .args([\"rev-parse\", \"--abbrev-ref\", \"HEAD\"])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::piped())\n        .stderr(std::process::Stdio::null())\n        .output()\n        .ok()\n        .and_then(|o| {\n            if o.status.success() {\n                Some(String::from_utf8_lossy(\u0026o.stdout).trim().to_string())\n            } else {\n                None\n            }\n        })\n        .filter(|s| !s.is_empty())\n}\n\npub(crate) fn has_only_main_branch(repo: \u0026Path) -\u003e bool {\n    let config_path = repo.join(\".git\").join(\"config\");\n    if let Ok(config) = std::fs::read_to_string(\u0026config_path) {\n        let has_main = config.lines().any(|l| l.trim() == \"[branch \\\"main\\\"]\");\n        let has_master = config.lines().any(|l| l.trim() == \"[branch \\\"master\\\"]\");\n        return has_main \u0026\u0026 !has_master;\n    }\n    // Fallback\n    let has_main = std_git_command()\n        .args([\"rev-parse\", \"--verify\", \"refs/heads/main\"])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::null())\n        .status()\n        .map(|s| s.success())\n        .unwrap_or(false);\n    let has_master = std_git_command()\n        .args([\"rev-parse\", \"--verify\", \"refs/heads/master\"])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::null())\n        .status()\n        .map(|s| s.success())\n        .unwrap_or(false);\n    has_main \u0026\u0026 !has_master\n}\n\npub(crate) fn has_both_main_and_master(repo: \u0026Path) -\u003e bool {\n    let config_path = repo.join(\".git\").join(\"config\");\n    let has_local_branches = if let Ok(config) = std::fs::read_to_string(\u0026config_path) {\n        config.lines().any(|l| l.trim() == \"[branch \\\"main\\\"]\")\n            \u0026\u0026 config.lines().any(|l| l.trim() == \"[branch \\\"master\\\"]\")\n    } else {\n        false\n    };\n    if has_local_branches {\n        return true;\n    }\n    // Fallback: check with git (suppress stderr for detached HEAD repos)\n    let has_main = std_git_command()\n        .args([\"rev-parse\", \"--verify\", \"refs/heads/main\"])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::null())\n        .status()\n        .map(|s| s.success())\n        .unwrap_or(false);\n    let has_master = std_git_command()\n        .args([\"rev-parse\", \"--verify\", \"refs/heads/master\"])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::null())\n        .status()\n        .map(|s| s.success())\n        .unwrap_or(false);\n    has_main \u0026\u0026 has_master\n}\n\npub(crate) fn consolidate_to_master(repo: \u0026Path) -\u003e Result\u003c()\u003e {\n    let branch = current_branch(repo).unwrap_or_else(|| \"master\".to_string());\n    if branch != \"master\" {\n        std_git_command()\n            .args([\"checkout\", \"master\"])\n            .current_dir(repo)\n            .status()\n            .with_context(|| format!(\"failed to checkout master in {}\", repo.display()))?;\n    }\n    // Delete local main if it exists\n    let _ = std_git_command()\n        .args([\"branch\", \"-D\", \"main\"])\n        .current_dir(repo)\n        .status();\n    // Delete remote main if it exists\n    let _ = std_git_command()\n        .args([\"push\", \"origin\", \"--delete\", \"main\"])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::null())\n        .status();\n    // Ensure master has upstream tracking\n    if has_origin_remote(repo) \u0026\u0026 !has_tracking_upstream(repo) {\n        let _ = std_git_command()\n            .args([\"push\", \"-u\", \"origin\", \"master\"])\n            .current_dir(repo)\n            .status();\n    }\n    Ok(())\n}\n\npub(crate) fn rename_main_to_master(repo: \u0026Path) -\u003e Result\u003c()\u003e {\n    let branch = current_branch(repo).unwrap_or_else(|| \"main\".to_string());\n    if branch == \"main\" {\n        std_git_command()\n            .args([\"branch\", \"-m\", \"main\", \"master\"])\n            .current_dir(repo)\n            .status()\n            .with_context(|| format!(\"failed to rename main to master in {}\", repo.display()))?;\n    }\n    if has_origin_remote(repo) {\n        let _ = std_git_command()\n            .args([\"push\", \"-u\", \"origin\", \"master\"])\n            .current_dir(repo)\n            .stdout(std::process::Stdio::null())\n            .stderr(std::process::Stdio::null())\n            .status();\n        let _ = std_git_command()\n            .args([\"push\", \"origin\", \"--delete\", \"main\"])\n            .current_dir(repo)\n            .stdout(std::process::Stdio::null())\n            .stderr(std::process::Stdio::null())\n            .status();\n    }\n    Ok(())\n}\n\n/// Delete the \"other\" default branch if it exists, preventing dual-branch drift.\n/// If current branch is master → delete main. If current is main → delete master.\npub(crate) fn prune_other_default_branch(repo: \u0026Path) {\n    let branch = current_branch(repo);\n    let other = match branch.as_deref() {\n        Some(\"master\") =\u003e \"main\",\n        Some(\"main\") =\u003e \"master\",\n        _ =\u003e return,\n    };\n    // Delete local other branch if it exists\n    let _ = std_git_command()\n        .args([\"branch\", \"-D\", other])\n        .current_dir(repo)\n        .stdout(std::process::Stdio::null())\n        .stderr(std::process::Stdio::null())\n        .status();\n    // Delete remote other branch if it exists\n    if has_origin_remote(repo) {\n        let _ = std_git_command()\n            .args([\"push\", \"origin\", \"--delete\", other])\n            .current_dir(repo)\n            .stdout(std::process::Stdio::null())\n            .stderr(std::process::Stdio::null())\n            .status();\n    }\n}\n\npub(crate) fn remote_branch_exists(repo: \u0026Path, branch: \u0026str) -\u003e bool {\n    std_git_command()\n        .args([\"show-ref\", \"--verify\", \"--quiet\"])\n        .arg(format!(\"refs/remotes/origin/{branch}\"))\n        .current_dir(repo)\n        .status()\n        .map(|s| s.success())\n        .unwrap_or(false)\n}\n\npub(crate) fn set_upstream_to_branch(repo: \u0026Path, branch: \u0026str) -\u003e Result\u003c()\u003e {\n    let target = format!(\"origin/{branch}\");\n    let status = std_git_command()\n        .args([\"branch\", \"--set-upstream-to\"])\n        .arg(\u0026target)\n        .arg(branch)\n        .current_dir(repo)\n        .status()\n        .with_context(|| format!(\"failed to set upstream for {}\", repo.display()))?;\n    if status.success() {\n        Ok(())\n    } else {\n        Err(anyhow::anyhow!(\n            \"set-upstream failed for {} -\u003e {}\",\n            repo.display(),\n            target\n        ))\n    }\n}\n\npub(crate) fn detect_large_blobs_ahead(repo: \u0026Path, min_bytes: u64) -\u003e Result\u003cVec\u003c(u64, String)\u003e\u003e {\n    // Step 1: Get object IDs from commits ahead of upstream\n    let rev_list = std_git_command()\n        .args([\"rev-list\", \"--objects\", \"@{u}..HEAD\"])\n        .current_dir(repo)\n        .output()\n        .with_context(|| format!(\"failed rev-list in {}\", repo.display()))?;\n    if !rev_list.status.success() {\n        return Ok(Vec::new());\n    }\n\n    // Step 2: Batch-check object types and sizes (no shell involved)\n    let mut cat_file = std_git_command()\n        .args([\"cat-file\", \"--batch-check=%(objectname) %(objecttype) %(objectsize) %(rest)\"])\n        .current_dir(repo)\n        .stdin(std::process::Stdio::piped())\n        .stdout(std::process::Stdio::piped())\n        .spawn()\n        .with_context(|| format!(\"failed cat-file in {}\", repo.display()))?;\n\n    if let Some(mut stdin) = cat_file.stdin.take() {\n        use std::io::Write;\n        stdin.write_all(\u0026rev_list.stdout)?;\n    }\n    let output = cat_file.wait_with_output()?;\n    if !output.status.success() {\n        return Ok(Vec::new());\n    }\n\n    // Step 3: Filter blobs \u003e min_bytes in Rust (no shell, no awk)\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let mut out: Vec\u003c(u64, String)\u003e = stdout\n        .lines()\n        .filter_map(|line| {\n            let mut parts = line.split_whitespace();\n            let _oid = parts.next()?;\n            let obj_type = parts.next()?;\n            let size_str = parts.next()?;\n            let path = parts.next()?;\n            if obj_type == \"blob\" {\n                let size = size_str.parse::\u003cu64\u003e().ok()?;\n                if size \u003e min_bytes {\n                    return Some((size, path.to_string()));\n                }\n            }\n            None\n        })\n        .collect();\n    out.sort_by(|a, b| b.0.cmp(\u0026a.0));\n    Ok(out)\n}\n\npub(crate) fn top_level_dir(path: \u0026str) -\u003e Option\u003cString\u003e {\n    path.split('/').next().map(|s| s.to_string())\n}\n\npub(crate) fn rewrite_ahead_paths(\n    repo: \u0026Path,\n    paths_to_remove: \u0026[String],\n    backup_prefix: \u0026str,\n) -\u003e Result\u003cOption\u003cString\u003e\u003e {\n    if paths_to_remove.is_empty() {\n        return Ok(None);\n SON.\n        #[arg(long)]\n        json: bool,\n    },\n    /// One-off report across discovered repositories.\n    Repos {\n        /// Show only concern repos.\n        #[arg(long)]\n        only_concern: bool,\n        /// Show only warn repos.\n        #[arg(long, conflicts_with = \"only_concern\")]\n        only_warn: bool,\n        /// Emit machine-readable JSON.\n        #[arg(long)]\n        json: bool,\n    },\n    /// Repair concern repos (dry-run by default; use --apply to execute).\n    RepairConcerns {\n        /// Execute git operations to repair concerns.\n        #[arg(long)]\n        apply: bool,\n        /// Only repair this repository path.\n        #[arg(long)]\n        repo: Option\u003cPathBuf\u003e,\n        /// Override push timeout seconds for this run.\n        #[arg(long)]\n        push_timeout_secs: Option\u003cu64\u003e,\n        /// Retry count for push operations.\n        #[arg(long, default_value_t = 3)]\n        push_retries: u32,\n        /// Allow rewrite of large blobs even when paths are outside excluded dirs.\n        #[arg(long)]\n        rewrite_large_any: bool,\n        /// Only repair stuck push concerns.\n        #[arg(long, conflicts_with = \"only_stuck_pull\")]\n        only_stuck_push: bool,\n        /// Only repair stuck pull concerns.\n        #[arg(long, conflicts_with = \"only_stuck_push\")]\n        only_stuck_pull: bool,\n        /// Emit machine-readable JSON.\n        #[arg(long)]\n        json: bool,\n    },\n    /// Repair warn repos (dirty-only triage; dry-run by default).\n    RepairWarns {\n        /// Execute git operations to repair warns.\n        #[arg(long)]\n        apply: bool,\n        /// Only repair this repository path.\n        #[arg(long)]\n        repo: Option\u003cPathBuf\u003e,\n        /// Emit machine-readable JSON.\n        #[arg(long)]\n        json: bool,\n    },\n    /// Run one sync pass.\n    Once,\n    /// Run continuous sync loop.\n    Daemon,\n    /// Sync a specific repository now.\n    SyncNow { repo: PathBuf },\n    /// Open sync policy in the system editor.\n    EditConfig,\n    /// Test AI providers connectivity.\n    TestAi,\n    /// List repos that are permanently stuck on push.\n    StuckList,\n    /// Unstuck a repo that was marked as permanently stuck.\n    UnstuckRepo { repo: PathBuf },\n    /// List repos that have both main and master branches.\n    DualBranchList,\n    /// Consolidate a repo with both main and master to master only.\n    RepairDualBranches { repo: PathBuf },\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c()\u003e {\n    // If output is piped (e.g. `dracon-sync repos | head`), stdout can become a broken pipe.\n    // Rust's default printing panics on write errors; convert that specific panic into a clean exit.\n    let default_panic_hook = std::panic::take_hook();\n    std::panic::set_hook(Box::new(move |info| {\n        let msg = info.to_string();\n        if msg.contains(\"Broken pipe\") {\n            std::process::exit(0);\n        }\n        default_panic_hook(info);\n    }));\n\n    let cli = Cli::parse();\n    let policy_path = resolve_policy_path()?;\n\n    match cli.cmd {\n        Command::Status { json } =\u003e {\n            let policy = SyncPolicy::load(\u0026policy_path)?;\n            let roots = policy.watch_root_paths();\n            let excluded_dir_names = excluded_dir_names_set(\u0026policy);\n            let repos = git::discover_git_repos(\u0026roots, \u0026excluded_dir_names, \u0026policy.exclude_repos);\n            let freeze = freeze_reason(\u0026policy_path);\n            if json {\n                let payload = report::StatusJson {\n                    policy: policy_path.display().to_string(),\n                    roots: roots.iter().map(|p| p.display().to_string()).collect(),\n                    repos_discovered: repos.len(),\n                    pulse_interval_secs: policy.pulse_interval_secs,\n                    inactivity_push_delay_secs: policy.inactivity_push_delay_secs,\n                    freeze: freeze\n                        .map(|r| format!(\"ON ({})\", r))\n                        .unwrap_or_else(|| \"OFF\".to_string()),\n                    auto_commit: policy.auto_commit,\n                    auto_pull: policy.auto_pull,\n                    auto_push: policy.auto_push,\n                    auto_bump_versions: policy.auto_bump_versions,\n                    auto_repair_concerns: policy.auto_repair_concerns,\n                    auto_repair_warns: policy.auto_repair_warns,\n                    auto_rewrite_large_blobs: policy.auto_rewrite_large_blobs,\n                    max_stage_file_bytes: policy.max_stage_file_bytes,\n                    push_blob_threshold_bytes: push_large_blob_threshold_bytes(\u0026policy),\n                    exclude_dirs: policy.exclude_dir_names.clone(),\n                    exclude_file_patterns: policy.exclude_file_patterns.clone(),\n                    pull_op_timeout_secs: policy.pull_op_timeout_secs,\n                    push_op_timeout_secs: policy.push_op_timeout_secs,\n                    repo_sync_timeout_secs: policy.repo_sync_timeout_secs,\n                    push_retries: policy.push_retries,\n                    repair_cooldown_secs: policy.repair_cooldown_secs,\n                    incident_ledger_max_lines: policy.incident_ledger_max_lines,\n                    incident_ledger_max_age_days: policy.incident_ledger_max_age_days,\n                    system_repo: policy.system_repo.clone(),\n                    backup_policy: policy.backup_policy.clone(),\n                    backup_dir: policy.backup_dir.clone(),\n                    extra_remotes: policy.extra_remotes.len(),\n                };\n                println!(\"{}\", serde_json::to_string_pretty(\u0026payload)?);\n            } else {\n                println!(\"📜 POLICY: {}\", policy_path.display());\n                println!(\"🔁 ROOTS: {:?}\", roots);\n                println!(\"📦 REPOS_DISCOVERED: {}\", repos.len());\n                println!(\"⏱️ PULSE: {}s\", policy.pulse_interval_secs);\n                println!(\n                    \"⏳ INACTIVITY_PUSH_DELAY: {}s\",\n                    policy.inactivity_push_delay_secs\n                );\n                println!(\n                    \"⏸️ FREEZE: {}\",\n                    freeze\n                        .map(|r| format!(\"ON ({})\", r))\n                        .unwrap_or_else(|| \"OFF\".to_string())\n                );\n                println!(\n                    \"⚙️ FLAGS: auto_commit={} auto_pull={} auto_push={} auto_bump_versions={} auto_repair_concerns={} auto_repair_warns={} auto_rewrite_large_blobs={}\",\n                    policy.auto_commit,\n                    policy.auto_pull,\n                    policy.auto_push,\n                    policy.auto_bump_versions,\n                    policy.auto_repair_concerns,\n                    policy.auto_repair_warns,\n                    policy.auto_rewrite_large_blobs\n                );\n                println!(\"📏 MAX_STAGE_FILE_BYTES: {}\", policy.max_stage_file_bytes);\n                println!(\n                    \"🧱 PUSH_BLOB_THRESHOLD_BYTES: {}\",\n                    push_large_blob_threshold_bytes(\u0026policy)\n                );\n                println!(\"🚫 EXCLUDE_DIRS: {:?}\", policy.exclude_dir_names);\n                println!(\"🚫 EXCLUDE_FILE_PATTERNS: {:?}\", policy.exclude_file_patterns);\n                println!(\n                    \"⏱️ TIMEOUTS: pull={}s push={}s repo={}s retries={}\",\n                    policy.pull_op_timeout_secs,\n                    policy.push_op_timeout_secs,\n                    policy.repo_sync_timeout_secs,\n                    policy.push_retries\n                );\n                println!(\n                    \"🧯 REPAIR: cooldown={}s ledger_max_lines={} ledger_max_age_days={}\",\n                    policy.repair_cooldown_secs,\n                    policy.incident_ledger_max_lines,\n                    policy.incident_ledger_max_age_days\n                );\n                if !policy.system_repo.is_empty() {\n                    println!(\"🏛️ SYSTEM_REPO: {}\", policy.system_repo);\n                }\n                if !policy.backup_policy.is_empty() || !policy.backup_dir.is_empty() {\n                    println!(\n                        \"🧰 BACKUP: policy={} dir={}\",\n                        policy.backup_policy, policy.backup_dir\n                    );\n                }\n                println!(\"🌐 EXTRA_REMOTES: {}\", policy.extra_remotes.len());\n            }\n        }\n        Command::Repos {\n            only_concern,\n            only_warn,\n            json,\n        } =\u003e {\n            let filter = if only_concern {\n                RepoFilter::Concern\n            } else if only_warn {\n                RepoFilter::Warn\n            } else {\n                RepoFilter::All\n            };\n            run_repos_report(\u0026policy_path, filter, json).await?;\n        }\n        Command::RepairConcerns {\n            apply,\n            repo,\n            push_timeout_secs,\n            push_retries,\n            rewrite_large_any,\n            only_stuck_push,\n            only_stuck_pull,\n            json,\n        } =\u003e {\n            let filter = if only_stuck_push {\n                ConcernRepairFilter::StuckPush\n            } else if only_stuck_pull {\n                ConcernRepairFilter::StuckPull\n            } else {\n                ConcernRepairFilter::All\n            };\n            run_repair_concerns(\n                \u0026policy_path,\n                apply,\n                repo,\n                push_timeout_secs,\n                push_retries,\n                rewrite_large_any,\n                filter,\n                json,\n            )\n            .await?;\n        }\n        Command::RepairWarns { apply, repo, json } =\u003e {\n            run_repair_warns(\u0026policy_path, apply, repo, json).awai , \"nohup.out\"]\n        .into_iter()\n        .map(String::from)\n        .collect()\n}\n\npub(crate) fn default_max_stage_file_bytes() -\u003e u64 {\n    100 * 1024 * 1024\n}\n\npub(crate) fn default_pull_op_timeout_secs() -\u003e u64 {\n    30\n}\n\npub(crate) fn default_push_op_timeout_secs() -\u003e u64 {\n    300\n}\n\npub(crate) fn default_repo_sync_timeout_secs() -\u003e u64 {\n    420\n}\n\npub(crate) fn default_push_retries() -\u003e u32 {\n    3\n}\n\npub(crate) fn default_repair_cooldown_secs() -\u003e u64 {\n    60\n}\n\npub(crate) fn default_max_push_blob_bytes() -\u003e u64 {\n    DEFAULT_GIT_HOST_BLOB_LIMIT_BYTES\n}\n\npub(crate) fn default_incident_ledger_max_lines() -\u003e usize {\n    10_000\n}\n\npub(crate) fn default_incident_ledger_max_age_days() -\u003e u64 {\n    30\n}\n\nfn default_github_account() -\u003e String {\n    \"DraconDev\".to_string()\n}\n\nimpl SyncPolicy {\n    pub(crate) fn load(path: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        let content = std::fs::read_to_string(path)\n            .with_context(|| format!(\"failed to read policy {}\", path.display()))?;\n        let mut policy: Self = toml::from_str(\u0026content)\n            .with_context(|| format!(\"failed to parse policy {}\", path.display()))?;\n        if policy.exclude_dir_names.is_empty() {\n            policy.exclude_dir_names = default_exclude_dir_names();\n        }\n        if policy.max_stage_file_bytes == 0 {\n            policy.max_stage_file_bytes = default_max_stage_file_bytes();\n        }\n        if policy.pull_op_timeout_secs == 0 {\n            policy.pull_op_timeout_secs = default_pull_op_timeout_secs();\n        }\n        if policy.push_op_timeout_secs == 0 {\n            policy.push_op_timeout_secs = default_push_op_timeout_secs();\n        }\n        if policy.repo_sync_timeout_secs == 0 {\n            policy.repo_sync_timeout_secs = default_repo_sync_timeout_secs();\n        }\n        if policy.push_retries == 0 {\n            policy.push_retries = default_push_retries();\n        }\n        if policy.inactivity_push_delay_secs == 0 {\n            policy.inactivity_push_delay_secs = default_inactivity_push_delay_secs();\n        }\n        if policy.repair_cooldown_secs == 0 {\n            policy.repair_cooldown_secs = default_repair_cooldown_secs();\n        }\n        if policy.max_push_blob_bytes == 0 {\n            policy.max_push_blob_bytes = default_max_push_blob_bytes();\n        }\n        if policy.incident_ledger_max_lines == 0 {\n            policy.incident_ledger_max_lines = default_incident_ledger_max_lines();\n        }\n        if policy.incident_ledger_max_age_days == 0 {\n            policy.incident_ledger_max_age_days = default_incident_ledger_max_age_days();\n        }\n        if policy.pull_op_timeout_secs \u003c 5 {\n            eprintln!(\n                \"⚠️ pull_op_timeout_secs {} below minimum 5s, adjusting\",\n                policy.pull_op_timeout_secs\n            );\n            policy.pull_op_timeout_secs = 5;\n        }\n        if policy.push_op_timeout_secs \u003c 10 {\n            eprintln!(\n                \"⚠️ push_op_timeout_secs {} below minimum 10s, adjusting\",\n                policy.push_op_timeout_secs\n            );\n            policy.push_op_timeout_secs = 10;\n        }\n        policy.max_push_blob_bytes = policy\n            .max_push_blob_bytes\n            .min(DEFAULT_GIT_HOST_BLOB_LIMIT_BYTES)\n            .max(1);\n        policy.repo_sync_timeout_secs = policy.repo_sync_timeout_secs.max(\n            policy\n                .push_op_timeout_secs\n                .saturating_add(30)\n                .max(policy.pull_op_timeout_secs.saturating_add(30)),\n        );\n        Ok(policy)\n    }\n\n    pub(crate) fn watch_root_paths(\u0026self) -\u003e Vec\u003cPathBuf\u003e {\n        self.watch_roots\n            .iter()\n            .map(PathBuf::from)\n            .filter(|p| {\n                if !p.exists() {\n                    eprintln!(\"⚠️ watch root {} does not exist, skipping\", p.display());\n                    false\n                } else {\n                    true\n                }\n            })\n            .collect()\n    }\n}\n\npub(crate) fn resolve_policy_path() -\u003e Result\u003cPathBuf\u003e {\n    let home = dirs::home_dir().context(\"home not found\")?;\n    if let Ok(val) = std::env::var(\"DRACON_SYNC_POLICY\") {\n        return Ok(PathBuf::from(val));\n    }\n    let paths = [\n        home.join(\".dracon/utilities/sync/dracon-sync.toml\"),\n        home.join(\".dracon/utilities/sync/config.toml\"),\n        home.join(\".dracon/git/dracon-git.toml\"),\n    ];\n    for path in \u0026paths {\n        if path.exists() {\n            return Ok(path.clone());\n        }\n    }\n    anyhow::bail!(\"sync policy not found\")\n}\n\npub(crate) fn env_freeze_enabled() -\u003e bool {\n    matches!(\n        std::env::var(\"DRACON_SYNC_FREEZE\")\n            .unwrap_or_default()\n            .to_ascii_lowercase()\n            .as_str(),\n        \"1\" | \"true\" | \"yes\" | \"on\"\n    )\n}\n\npub(crate) fn debug_enabled() -\u003e bool {\n    matches!(\n        std::env::var(\"DRACON_SYNC_DEBUG\")\n            .unwrap_or_default()\n            .to_ascii_lowercase()\n            .as_str(),\n        \"1\" | \"true\" | \"yes\" | \"on\"\n    )\n}\n\npub(crate) fn freeze_marker_paths(_policy_path: \u0026Path) -\u003e Vec\u003cPathBuf\u003e {\n    let mut paths = Vec::new();\n    // Freeze markers are intentionally kept out of git-tracked repos to avoid accidental\n    // perpetual DIRTY states and surprise \"sync frozen\" incidents.\n    //\n    // Canonical locations:\n    // - ~/.dracon/dracon-sync.freeze\n    // - ~/.dracon/freeze/dracon-sync\n    if let Some(home) = dirs::home_dir() {\n        paths.push(home.join(\".dracon\").join(\"dracon-sync.freeze\"));\n        paths.push(home.join(\".dracon\").join(\"freeze\").join(\"dracon-sync\"));\n    }\n    paths\n}\n\npub(crate) fn freeze_reason(policy_path: \u0026Path) -\u003e Option\u003cString\u003e {\n    if env_freeze_enabled() {\n        return Some(\"env DRACON_SYNC_FREEZE\".to_string());\n    }\n\n    for marker in freeze_marker_paths(policy_path) {\n        if marker.exists() {\n            return Some(format!(\"marker {}\", marker.display()));\n        }\n    }\n\n    None\n}\n\npub(crate) fn open_policy_in_editor(policy_path: \u0026Path) -\u003e Result\u003c()\u003e {\n    let mut editors = Vec::new();\n    if let Ok(visual) = std::env::var(\"VISUAL\") {\n        if !visual.trim().is_empty() {\n            editors.push(visual);\n        }\n    }\n    if let Ok(editor) = std::env::var(\"EDITOR\") {\n        if !editor.trim().is_empty() {\n            editors.push(editor);\n        }\n    }\n    for fallback in [\"nvim\", \"vim\", \"nano\", \"vi\"] {\n        editors.push(fallback.to_string());\n    }\n\n    for editor in editors {\n        match StdCommand::new(editor.trim()).arg(policy_path).status() {\n            Ok(status) if status.success() =\u003e return Ok(()),\n            Ok(status) =\u003e {\n                return Err(anyhow::anyhow!(\n                    \"editor exited non-zero ({}). policy: {}\",\n                    status,\n                    policy_path.display()\n                ));\n            }\n            Err(e) if e.kind() == std::io::ErrorKind::NotFound =\u003e continue,\n            Err(e) =\u003e {\n                return Err(anyhow::anyhow!(\n                    \"failed to launch editor '{}' for {}: {}\",\n                    editor,\n                    policy_path.display(),\n                    e\n                ));\n            }\n        }\n    }\n\n    Err(anyhow::anyhow!(\n        \"no editor available. set VISUAL or EDITOR to open {}\",\n        policy_path.display()\n    ))\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_default_exclude_dir_names() {\n        let dirs = default_exclude_dir_names();\n        assert!(di
