ress":[],"length":0,"stats":{"Line":0}},{"line":379,"address":[],"length":0,"stats":{"Line":0}},{"line":380,"address":[],"length":0,"stats":{"Line":0}},{"line":381,"address":[],"length":0,"stats":{"Line":0}},{"line":382,"address":[],"length":0,"stats":{"Line":0}},{"line":383,"address":[],"length":0,"stats":{"Line":0}},{"line":384,"address":[],"length":0,"stats":{"Line":0}},{"line":387,"address":[],"length":0,"stats":{"Line":0}},{"line":388,"address":[],"length":0,"stats":{"Line":0}},{"line":389,"address":[],"length":0,"stats":{"Line":0}},{"line":390,"address":[],"length":0,"stats":{"Line":0}},{"line":391,"address":[],"length":0,"stats":{"Line":0}},{"line":392,"address":[],"length":0,"stats":{"Line":0}},{"line":393,"address":[],"length":0,"stats":{"Line":0}},{"line":399,"address":[],"length":0,"stats":{"Line":0}},{"line":400,"address":[],"length":0,"stats":{"Line":0}},{"line":401,"address":[],"length":0,"stats":{"Line":0}}],"covered":43,"coverable":189},{"path":["/","home","dracon","Dev","dracon-utilities","dracon-sync","src","report.rs"],"content":"use anyhow::{Context, Result};\nuse dracon_git::{\n    build_commit_message,\n    types::{DiffFile, FileStatus, RepoStatus},\n    CommitContext, extract_intent, GitService,\n};\nuse serde::Serialize;\nuse std::collections::{BTreeSet, HashMap};\nuse std::path::{Path, PathBuf};\nuse std::time::{SystemTime, UNIX_EPOCH};\nuse tokio::time::Duration;\n\nuse crate::bump::{bump_patch_version_in_repo, bump_node_package_version_in_repo, bump_version_file_in_repo};\nuse crate::exclude::{\n    excluded_dir_names_set, should_stage_entry, is_excluded_change_path,\n    has_sync_relevant_dirty_entries, is_large_untracked, can_restore_entry,\n    append_to_gitignore, handle_large_untracked, is_excluded_file,\n    is_excluded_dir_name,\n};\nuse crate::git::{\n    has_origin_remote, has_tracking_upstream, discover_git_repos, origin_url,\n    strip_url_credentials, push_with_retries, rewrite_ahead_paths, current_branch,\n    remote_branch_exists, set_upstream_to_branch, detect_large_blobs_ahead,\n    top_level_dir, repo_diff_entries, run_git_with_timeout, run_git_capture_output,\n    unstage_excluded_paths, unstage_oversized_paths, staged_paths,\n};\nuse crate::policy::{\n    SyncPolicy, resolve_policy_path, freeze_reason, debug_enabled,\n    DEFAULT_GIT_HOST_BLOB_LIMIT_BYTES, tokio_git_command,\n};\n\nfn ansi(color: \u0026str, text: \u0026str) -\u003e String {\n    let codes = match color {\n        \"31\" =\u003e \"31\",\n        \"32\" =\u003e \"32\",\n        \"33\" =\u003e \"33\",\n        \"34\" =\u003e \"34\",\n        \"35\" =\u003e \"35\",\n        \"36\" =\u003e \"36\",\n        \"37\" =\u003e \"37\",\n        \"1\" =\u003e \"1\",\n        _ =\u003e \"0\",\n    };\n    format!(\"\\x1b[{}m{}\\x1b[0m\", codes, text)\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum RepoFilter {\n    All,\n    Concern,\n    Warn,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum ConcernRepairFilter {\n    All,\n    StuckPush,\n    StuckPull,\n}\n\n#[derive(Debug, Serialize)]\npub(crate) struct RepoReportRow {\n    repo: String,\n    state_flags: Vec\u003cString\u003e,\n    branch: String,\n    modified: usize,\n    staged: usize,\n    ahead: usize,\n    behind: usize,\n    last_hash: String,\n    last_author: String,\n    last_when: String,\n    last_msg: String,\n    last_unix: i64,\n    concern: bool,\n    warn: bool,\n    hint: String,\n}\n\n#[derive(Debug, Serialize)]\npub(crate) struct RepoReportJson {\n    policy: String,\n    filter: String,\n    repos: usize,\n    ok: usize,\n    warn: usize,\n    concern: usize,\n    failures: usize,\n    rows: Vec\u003cRepoReportRow\u003e,\n}\n\n#[derive(Debug, Serialize)]\npub(crate) struct StatusJson {\n    pub(crate) policy: String,\n    pub(crate) roots: Vec\u003cString\u003e,\n    pub(crate) repos_discovered: usize,\n    pub(crate) pulse_interval_secs: u64,\n    pub(crate) inactivity_push_delay_secs: u64,\n    pub(crate) freeze: String,\n    pub(crate) auto_commit: bool,\n    pub(crate) auto_pull: bool,\n    pub(crate) auto_push: bool,\n    pub(crate) auto_bump_versions: bool,\n    pub(crate) auto_repair_concerns: bool,\n    pub(crate) auto_repair_warns: bool,\n    pub(crate) auto_rewrite_large_blobs: bool,\n    pub(crate) max_stage_file_bytes: u64,\n    pub(crate) push_blob_threshold_bytes: u64,\n    pub(crate) exclude_dirs: Vec\u003cString\u003e,\n    pub(crate) exclude_file_patterns: Vec\u003cString\u003e,\n    pub(crate) pull_op_timeout_secs: u64,\n    pub(crate) push_op_timeout_secs: u64,\n    pub(crate) repo_sync_timeout_secs: u64,\n    pub(crate) push_retries: u32,\n    pub(crate) repair_cooldown_secs: u64,\n    pub(crate) incident_ledger_max_lines: usize,\n    pub(crate) incident_ledger_max_age_days: u64,\n    pub(crate) system_repo: String,\n    pub(crate) backup_policy: String,\n    pub(crate) backup_dir: String,\n    pub(crate) extra_remotes: usize,\n}\n\n#[derive(Debug, Serialize)]\npub(crate) struct RepairJson {\n    policy: String,\n    scope: String,\n    mode: String,\n    found: usize,\n    planned: usize,\n    attempted: usize,\n    succeeded: usize,\n    resolved_now: usize,\n    manual_only: usize,\n    ledger: String,\n}\n\n#[derive(Debug, Default, Clone, Copy)]\npub(crate) struct RepairSummary {\n    pub(crate) found: usize,\n    pub(crate) planned: usize,\n    pub(crate) attempted: usize,\n    pub(crate) succeeded: usize,\n    pub(crate) resolved_now: usize,\n    pub(crate) manual_only: usize,\n}\n\n#[derive(Debug, Serialize)]\npub(crate) struct IncidentRecord {\n    ts_unix: u64,\n    scope: String,\n    repo: String,\n    reason: String,\n    action: String,\n    backup_branch: Option\u003cString\u003e,\n    result: String,\n    details: Option\u003cString\u003e,\n}\n\nimpl IncidentRecord {\n    pub(crate) fn new(scope: \u0026str, repo: \u0026str, reason: \u0026str, action: \u0026str, result: \u0026str) -\u003e Self {\n        Self {\n            ts_unix: timestamp_secs(),\n            scope: scope.to_string(),\n            repo: repo.to_string(),\n            reason: reason.to_string(),\n            action: action.to_string(),\n            backup_branch: None,\n            result: result.to_string(),\n            details: None,\n        }\n    }\n\n    pub(crate) fn with_details(mut self, details: \u0026str) -\u003e Self {\n        self.details = Some(details.to_string());\n        self\n    }\n\n    pub(crate) fn with_backup_branch(mut self, branch: \u0026str) -\u003e Self {\n        self.backup_branch = Some(branch.to_string());\n        self\n    }\n}\n\n#[derive(Debug, Clone)]\npub(crate) enum ReportSignal {\n    ActiveBoardChanged,\n    IndexChanged,\n    BlueprintCreated,\n    BlueprintModified,\n}\n\npub(crate) fn detect_report_signals(\n    _repo: \u0026Path,\n    changed_files: \u0026[DiffFile],\n) -\u003e Vec\u003cReportSignal\u003e {\n    let mut signals = Vec::new();\n    \n    for file in changed_files {\n        let path_str = file.path.to_string_lossy();\n        \n        if path_str == \"plan/ACTIVE_BOARD.md\" || path_str.ends_with(\"/ACTIVE_BOARD.md\") {\n            signals.push(ReportSignal::ActiveBoardChanged);\n        }\n        \n        if path_str == \"plan/index.md\" || path_str.ends_with(\"/index.md\") {\n            signals.push(ReportSignal::IndexChanged);\n        }\n        \n        if path_str.contains(\"blueprint-\") \u0026\u0026 path_str.ends_with(\".md\") {\n            if file.status == dracon_git::types::FileStatus::Added {\n                signals.push(ReportSignal::BlueprintCreated);\n            } else {\n                signals.push(ReportSignal::BlueprintModified);\n            }\n        }\n    }\n    \n    signals\n}\n\npub(crate) fn read_project_focus(repo: \u0026Path) -\u003e Option\u003cString\u003e {\n    let state_path = repo.join(\".dracon/project-state.md\");\n    let content = std::fs::read_to_string(\u0026state_path).ok()?;\n    \n    // Return full project-state.md content for rich commit bodies\n    // This gives AI reading git history full context (Completed, In Progress, Open Issues)\n    let trimmed = content.trim();\n    if trimmed.is_empty() {\n        None\n    } else {\n        Some(trimmed.to_string())\n    }\n}\n\npub(crate) fn build_commit_context(\n    repo: \u0026Path,\n    status: \u0026RepoStatus,\n    entries: \u0026[DiffFile],\n    is_checkpoint: bool,\n    idle_seconds: u64,\n) -\u003e CommitContext {\n    let changed_paths: Vec\u003cPathBuf\u003e = entries.iter().map(|e| e.path.clone()).collect();\n    let intent_info = extract_intent(repo, \u0026changed_paths, Some(\u0026status.branch));\n    \n    let refs = intent_info.blueprint.as_ref().map(|p| {\n        let rel = p.strip_prefix(repo).unwrap_or(p);\n        rel.to_string_lossy().to_string()\n    });\n    \n    // Read project state for commit body (scribe)\n    let description = read_project_focus(repo);\n    \n    CommitContext {\n        intent: intent_info.intent,\n        track: intent_info.track,\n        is_checkpoint,\n        files: entries.to_vec(),\n        task_progress: intent_info.task_progress,\n        refs,\n        idle_seconds,\n        category: None,\n        scope: None,\n        severity: None,\n        description,\n        semantic_summary: None,\n    }\n}\n\npub(crate) fn timestamp_secs() -\u003e u64 {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .map(|d| d.as_secs())\n        .unwrap_or(0)\n}\n\npub(crate) fn incident_ledger_path(_policy_path: \u0026Path) -\u003e PathBuf {\n    // IMPORTANT: Keep this ledger OUT of git repositories by default.\n    // The policy file typically lives inside the system repo; writing next to it\n    // causes perpetual DIRTY state and churn.\n    if let Ok(custom) = std::env::var(\"DRACON_SYNC_LEDGER\") {\n        let p = PathBuf::from(custom);\n        if !p.as_os_str().is_empty() {\n            return p;\n        }\n    }\n\n    if let Some(home) = dirs::home_dir() {\n        return home.join(\".dracon\").join(\"dracon-sync-incidents.jsonl\");\n    }\n\n    PathBuf::from(\"/tmp/dracon-sync-incidents.jsonl\")\n}\n\npub(crate) fn append_incident_record(policy_path: \u0026Path, record: \u0026IncidentRecord) {\n    fn enforce_retention(path: \u0026Path, policy: \u0026SyncPolicy) -\u003e Result\u003c()\u003e {\n        let content = std::fs::read_to_string(path)?;\n        let now = timestamp_secs();\n        let age_cutoff = now.saturating_sub(policy.incident_ledger_max_age_days.saturating_mul(86_400));\n\n        let mut kept: Vec\u003cString\u003e = Vec::new();\n        for line in content.lines() {\n            let line = line.trim();\n            if line.is_empty() {\n                continue;\n            }\n            let keep_by_age = serde_json::from_str::\u003cserde_json::Value\u003e(line)\n                .ok()\n                .and_then(|v| v.get(\"ts_unix\").and_then(|t| t.as_u64()))\n                .map(|ts| ts \u003e= age_cutoff)\n                .unwrap_or(true);\n            if keep_by_age {\n                kept.push(line.to_string());\n            }\n        }\n        if kept.len() \u003e policy.incident_ledger_max_lines {\n            let drop_n = kept.len() - policy.incident_ledger_max_lines;\n            kept.drain(0..drop_n);\n        }\n        let mut out = String::new();\n        for line in kept {\n            out.push_str(\u0026line);\n            out.push('\\n');\n        }\n        std::fs::write(path, \u0026out)?;\n\n        Ok(())\n    }\n    // ── append logic ──\n    let path = incident_ledger_path(policy_path);\n    let line = match serde_json::to_string(record) {\n        Ok(v) =\u003e v,\n        Err(e) =\u003e {\n            eprintln!(\"⚠️ incident serialize failed: {}\", e);\n            return;\n        }\n    };\n    let parent = path.parent().map(Path::to_path_buf);\n    if let Some(dir) = parent {\n        let _ = std::fs::create_dir_all(dir);\n    }\n    match std::fs::OpenOptions::new()\n        .create(true)\n        .append(true)\n        .open(\u0026path)\n    {\n        Ok(mut file) =\u003e {\n            use std::io::Write;\n            if let Err(e) = writeln!(file, \"{}\", line) {\n                eprintln!(\"⚠️ incident write failed ({}): {}\", path.display(), e);\n            } else if let Ok(policy) = SyncPolicy::load(policy_path) {\n                if let Err(e) = enforce_retention(\u0026path, \u0026policy) {\n                    eprintln!(\"⚠️ incident retention failed ({}): {}\", path.display(), e);\n                }\n            }\n        }\n        Err(e) =\u003e eprintln!(\"⚠️ incident open failed ({}): {}\", path.display(), e),\n    }\n}\n\npub(crate) fn repo_state_flags(\n    status: \u0026dracon_git::types::RepoStatus,\n    has_origin: bool,\n    has_upstream: bool,\n) -\u003e Vec\u003cString\u003e {\n    let mut flags = Vec::new();\n    if !status.is_clean {\n        flags.push(\"DIRTY\".to_string());\n    }\n    if status.ahead \u003e 0 {\n        flags.push(format!(\"AHEAD:{}\", status.ahead));\n    }\n    if status.behind \u003e 0 {\n        flags.push(format!(\"BEHIND:{}\", status.behind));\n    }\n    if !has_origin {\n        flags.push(\"NO_ORIGIN\".to_string());\n    }\n    if has_origin \u0026\u0026 !has_upstream {\n        flags.push(\"NO_UPSTREAM\".to_string());\n    }\n    if status.ahead \u003e 0 \u0026\u0026 has_origin \u0026\u0026 has_upstream {\n        flags.push(\"STUCK_PUSH\".to_string());\n    }\n    if status.behind \u003e 0 \u0026\u0026 has_origin \u0026\u0026 has_upstream {\n        flags.push(\"STUCK_PULL\".to_string());\n    }\n    if flags.is_empty() {\n        flags.push(\"OK\".to_string());\n    }\n    flags\n}\n\npub(crate) fn repo_is_concern(status: \u0026dracon_git::types::RepoStatus, has_origin: bool, has_upstream: bool) -\u003e bool {\n    status.ahead \u003e 0 || status.behind \u003e 0 || !has_origin || (has_origin \u0026\u0026 !has_upstream)\n}\n\npub(crate) fn repo_is_warn(status: \u0026dracon_git::types::RepoStatus, has_origin: bool, has_upstream: bool) -\u003e bool {\n    !repo_is_concern(status, has_origin, has_upstream) \u0026\u0026 !status.is_clean\n}\n\npub(crate) fn repo_hint(flags: \u0026[String], warn: bool, concern: bool) -\u003e String {\n    if flags.iter().any(|f| f == \"NO_ORIGIN\") {\n        return \"set origin remote\".to_string();\n    }\n    if flags.iter().any(|f| f == \"NO_UPSTREAM\") {\n        return \"run repair-concerns --apply (set upstream)\".to_string();\n    }\n    if flags.iter().any(|f| f.starts_with(\"AHEAD:\")) {\n        return \"run repair-concerns --apply (push or rewrite)\".to_string();\n    }\n    if flags.iter().any(|f| f.starts_with(\"BEHIND:\")) {\n        return \"run repair-concerns --apply (pull/rebase)\".to_string();\n    }\n    if warn {\n        return \"run repair-warns --apply\".to_string();\n    }\n    if concern {\n        return \"run repair-concerns --apply\".to_string();\n    }\n    \"healthy\".to_string()\n}\n\npub(crate) fn push_large_blob_threshold_bytes(policy: \u0026SyncPolicy) -\u003e u64 {\n    policy\n        .max_stage_file_bytes\n        .min(policy.max_push_blob_bytes)\n        .min(DEFAULT_GIT_HOST_BLOB_LIMIT_BYTES)\n}\n\npub(crate) fn truncate(value: \u0026str, max_chars: usize) -\u003e String {\n    if value.chars().count() \u003c= max_chars {\n        return value.to_string();\n    }\n    let shortened: String = value.chars().take(max_chars.saturating_sub(1)).collect();\n    format!(\"{}…\", shortened)\n}\n\npub(crate) async fn git_log_field(repo: \u0026Path, format: \u0026str) -\u003e Option\u003cString\u003e {\n    let output = tokio_git_command()\n        .args([\"log\", \"-1\", \u0026format!(\"--pretty=format:{}\", format)])\n        .current_dir(repo)\n        .output()\n        .await\n        .ok()?;\n    if !output.status.success() {\n        return None;\n    }\n    let value = String::from_utf8_lossy(\u0026output.stdout).trim().to_string();\n    if value.is_empty() {\n        None\n    } else {\n        Some(value)\n    }\n}\n\npub(crate) async fn git_log_unix_timestamp(repo: \u0026Path) -\u003e Option\u003ci64\u003e {\n    git_log_field(repo, \"%ct\")\n        .await\n        .and_then(|s| s.parse::\u003ci64\u003e().ok())\n}\n\npub(crate) async fn run_repos_report(policy_path: \u0026Path, filter: RepoFilter, json: bool) -\u003e Result\u003c()\u003e {\n    let policy = SyncPolicy::load(policy_path)?;\n    let roots = policy.watch_root_paths();\n    let excluded_dir_names = excluded_dir_names_set(\u0026policy);\n    let repos = discover_git_repos(\u0026roots, \u0026excluded_dir_names, \u0026policy.exclude_repos);\n    let mut rows: Vec\u003cRepoReportRow\u003e = Vec::new();\n    let mut init_or_status_failures = 0usize;\n\n    for repo in repos {\n        let svc = match GitService::new(\u0026repo) {\n            Ok(svc) =\u003e svc,\n            Err(e) =\u003e {\n                init_or_status_failures += 1;\n                println!(\n                    \"{} {} | init_failed: {}\",\n                    ansi(\"31\", \"❌\"),\n                    repo.display(),\n                    e\n                );\n                continue;\n            }\n        };\n\n        let status = match svc.get_status().await {\n            Ok(status) =\u003e status,\n            Err(e) =\u003e {\n                init_or_status_failures += 1;\n                println!(\n                    \"{} {} | status_failed: {}\",\n                    ansi(\"31\", \"❌\"),\n                    repo.display(),\n                    e\n                );\n                continue;\n            }\n        };\n        let entries = repo_diff_entries(\u0026repo).await.unwrap_or_default();\n        let effective_dirty = has_sync_relevant_dirty_entries(\n            \u0026repo,\n            \u0026entries,\n            \u0026excluded_dir_names,\n            \u0026policy.exclude_file_patterns,\n            policy.max_stage_file_bytes,\n        );\n        let effective_status = dracon_git::types::RepoStatus {\n            is_clean: !effective_dirty,\n            modified_files: if effective_dirty { status.modified_files } else { 0 },\n            ..status.clone()\n        };\n\n        let has_origin = has_origin_remote(\u0026repo);\n        let has_upstream = has_tracking_upstream(\u0026repo);\n\n        let flags = repo_state_flags(\u0026effective_status, has_origin, has_upstream);\n\n        let last_hash = status\n            .last_commit_hash\n            .as_deref()\n            .map(|h| truncate(h, 12))\n            .unwrap_or_else(|| \"-\".to_string());\n        let last_msg = status\n            .last_commit_msg\n            .as_deref()\n            .map(|m| truncate(m, 72))\n            .unwrap_or_else(|| \"-\".to_string());\n        let last_author = git_log_field(\u0026repo, \"%an\")\n            .await\n            .unwrap_or_else(|| \"-\".to_string());\n        let last_when = git_log_field(\u0026repo, \"%ar\")\n            .await\n            .unwrap_or_else(|| \"-\".to_string());\n        let last_unix = git_log_unix_timestamp(\u0026repo).await.unwrap_or(0);\n\n        let concern = repo_is_concern(\u0026effective_status, has_origin, has_upstream);\n        let warn = repo_is_warn(\u0026effective_status, has_origin, has_upstream);\n        let hint = repo_hint(\u0026flags, warn, concern);\n\n        rows.push(RepoReportRow {\n            repo: repo.display().to_string(),\n            state_flags: flags,\n            branch: effective_status.branch,\n            modified: effective_status.modified_files,\n            staged: effective_status.staged_files,\n            ahead: effective_status.ahead,\n            behind: effective_status.behind,\n            last_hash,\n            last_author,\n            last_when,\n            last_msg,\n            last_unix,\n            concern,\n            warn,\n            hint,\n        });\n    }\n\n    rows.sort_by(|a, b| b.last_unix.cmp(\u0026a.last_unix));\n\n    let concern_count_all = rows.iter().filter(|r| r.concern).count();\n    let warn_count_all = rows.iter().filter(|r| r.warn).count();\n    let ok_count_all = rows\n        .len()\n        .saturating_sub(concern_count_all + warn_count_all);\n    match filter {\n        RepoFilter::All =\u003e {}\n        RepoFilter::Concern =\u003e rows.retain(|r| r.concern),\n        RepoFilter::Warn =\u003e rows.retain(|r| r.warn),\n    }\n\n    let concern_count = rows.iter().filter(|r| r.concern).count();\n    let warn_count = rows.iter().filter(|r| r.warn).count();\n    let ok_count = rows.len().saturating_sub(concern_count + warn_count);\n    let filter_text = match filter {\n        RepoFilter::All =\u003e \"all\",\n        RepoFilter::Concern =\u003e \"only_concern\",\n        RepoFilter::Warn =\u003e \"only_warn\",\n    };\n\n    if json {\n        let payload = RepoReportJson {\n            policy: policy_path.display().to_string(),\n            filter: filter_text.to_string(),\n            repos: rows.len(),\n            ok: ok_count,\n            warn: warn_count,\n            concern: concern_count,\n            failures: init_or_status_failures,\n            rows,\n        };\n        println!(\"{}\", serde_json::to_string_pretty(\u0026payload)?);\n        return Ok(());\n    }\n\n    println!(\"📜 POLICY: {}\", policy_path.display());\n    match filter {\n        RepoFilter::All =\u003e {}\n        RepoFilter::Concern =\u003e {\n            println!(\n                \"📊 FILTER: only concern repos (showing {} of {})\",\n                rows.len(),\n                concern_count_all\n            );\n        }\n        RepoFilter::Warn =\u003e {\n            println!(\n                \"📊 FILTER: only warn repos (showing {} of {})\",\n                rows.len(),\n                warn_count_all\n            );\n        }\n    }\n    println!(\n        \"📦 REPOS: {}  {} {}  {} {}  {} {}  ❌ {}{}\",\n        rows.len(),\n        ansi(\"32\", \"OK\"),\n        ok_count,\n        ansi(\"33\", \"WARN\"),\n        warn_count,\n        ansi(\"31\", \"CONCERN\"),\n        concern_count,\n        init_or_status_failures,\n        match filter {\n            RepoFilter::All =\u003e String::new(),\n            RepoFilter::Concern | RepoFilter::Warn =\u003e format!(\n                \"  (all: OK {} WARN {} CONCERN {})\",\n                ok_count_all, warn_count_all, concern_count_all\n            ),\n        }\n    );\n    println!(\"🕒 SORT: last modified (newest first)\");\n    println!();\n\n    for (idx, row) in rows.iter().enumerate() {\n        let severity = if row.concern {\n            ansi(\"31\", \"CONCERN\")\n        } else if row.warn {\n            ansi(\"33\", \"WARN\")\n        } else {\n            ansi(\"32\", \"OK\")\n        };\n\n        println!(\"{}. [{}] {}\", idx + 1, severity, row.repo);\n        println!(\n            \"   updated={} branch={} state={} modified={} staged={} ahead={} behind={}\",\n            row.last_when,\n            row.branch,\n            row.state_flags.join(\",\"),\n            row.modified,\n            row.staged,\n            row.ahead,\n            row.behind\n        );\n        println!(\n            \"   last={} by {} {}\",\n            row.last_hash, row.last_author, row.last_msg\n        );\n        println!(\"   hint={}\", row.hint);\n        println!();\n    }\n\n    Ok(())\n}\n\npub(crate) async fn run_repair_concerns(\n    policy_path: \u0026Path,\n    apply: bool,\n    only_repo: Option\u003cPathBuf\u003e,\n    push_timeout_override: Option\u003cu64\u003e,\n    push_retries: u32,\n    rewrite_large_any: bool,\n    filter: ConcernRepairFilter,\n    json: bool,\n) -\u003e Result\u003cRepairSummary\u003e {\n    let human = !json;\n    macro_rules! out {\n        ($($arg:tt)*) =\u003e {{\n            if human {\n                println!($($arg)*);\n            }\n        }};\n    }\n\n    let policy = SyncPolicy::load(policy_path)?;\n    let roots = policy.watch_root_paths();\n    let excluded_dir_names = excluded_dir_names_set(\u0026policy);\n    let mut repos = if let Some(target_repo) = \u0026only_repo {\n        vec![target_repo.clone()]\n    } else {\n        discover_git_repos(\u0026roots, \u0026excluded_dir_names, \u0026policy.exclude_repos)\n    };\n    if repos.is_empty() {\n        if let Some(target_repo) = \u0026only_repo {\n            out!(\n                \"⚠️ target repo not discovered in policy roots: {}\",\n                target_repo.display()\n            );\n        }\n        return Ok(RepairSummary::default());\n    }\n    let push_timeout_secs = push_timeout_override\n        .unwrap_or(policy.push_op_timeout_secs)\n        .max(10);\n    let push_retries = push_retries.max(1);\n    let blob_threshold = push_large_blob_threshold_bytes(\u0026policy);\n\n    let mut concerns = 0usize;\n    let mut attempted_ops = 0usize;\n    let mut succeeded_ops = 0usize;\n    let mut manual_only = 0usize;\n    let mut resolved = 0usize;\n\n    out!(\"📜 POLICY: {}\", policy_path.display());\n    out!(\n        \"🛠️ MODE: {}\",\n        if apply {\n            \"APPLY (mutating)\"\n        } else {\n            \"DRY-RUN (no changes)\"\n        }\n    );\n    out!(\n        \"⚙️ PUSH: timeout={}s retries={}\",\n        push_timeout_secs, push_retries\n    );\n\n    for repo in repos {\n        let svc = match GitService::new(\u0026repo) {\n            Ok(svc) =\u003e svc,\n            Err(e) =\u003e {\n                eprintln!(\"⚠️ {} init_failed: {}\", repo.display(), e);\n                continue;\n            }\n        };\n        let status = match svc.get_status().await {\n            Ok(status) =\u003e status,\n            Err(e) =\u003e {\n                eprintln!(\"⚠️ {} status_failed: {}\", repo.display(), e);\n                continue;\n            }\n        };\n\n        let mut has_origin = has_origin_remote(\u0026repo);\n        let mut has_upstream = has_tracking_upstream(\u0026repo);\n        let is_concern = repo_is_concern(\u0026status, has_origin, has_upstream);\n        if !is_concern {\n            continue;\n        }\n        let stuck_push = status.ahead \u003e 0 \u0026\u0026 has_origin \u0026\u0026 has_upstream;\n        let stuck_pull = status.behind \u003e 0 \u0026\u0026 has_origin \u0026\u0026 has_upstream;\n        if matches!(filter, ConcernRepairFilter::StuckPush) \u0026\u0026 !stuck_push {\n            continue;\n        }\n        if matches!(filter, ConcernRepairFilter::StuckPull) \u0026\u0026 !stuck_pull {\n            continue;\n        }\n        concerns += 1;\n        let flags = repo_state_flags(\u0026status, has_origin, has_upstream);\n        let reason = flags.join(\",\");\n\n        out!(\n            \"\\n🔎 {}  state: ahead={} behind={} clean={} origin={} upstream={}\",\n            repo.display(),\n            status.ahead,\n            status.behind,\n            status.is_clean,\n            has_origin,\n            has_upstream\n        );\n\n        if !has_origin {\n            attempted_ops += 1;\n            if apply {\n                let private_remote = if policy.auto_github_private {\n                    out!(\"   plan: create GitHub private repo as origin\");\n                    create_github_private_remote(\u0026repo, \u0026policy.auto_github_private_account)\n                } else {\n                    out!(\"   plan: create private bare repo as origin\");\n                    create_private_remote(\u0026repo)\n                };\n                if let Some(private_remote) = private_remote {\n                    succeeded_ops += 1;\n                    has_origin = true;\n                    has_upstream = true;\n                    out!(\"   ok: created private remote: {}\", private_remote);\n                    append_incident_record(\n                        policy_path,\n                        \u0026IncidentRecord {\n                            ts_unix: timestamp_secs(),\n                            scope: \"concern\".to_string(),\n                            repo: repo.display().to_string(),\n                            reason: reason.clone(),\n                            action: \"create_private_remote\".to_string(),\n                            backup_branch: None,\n                            result: \"ok\".to_string(),\n                            details: Some(format!(\"created private remote: {}\", private_remote)),\n                        },\n                    );\n                } else {\n                    manual_only += 1;\n                    out!(\"   fail: could not create private remote\");\n                    append_incident_record(\n                        policy_path,\n                        \u0026IncidentRecord {\n                            ts_unix: timestamp_secs(),\n                            scope: \"concern\".to_string(),\n                            repo: repo.display().to_string(),\n                            reason: reason.clone(),\n                            action: \"create_private_remote\".to_string(),\n                            backup_branch: None,\n                            result: \"fail\".to_string(),\n                            details: Some(\"failed to create private remote\".to_string()),\n                        },\n                    );\n                }\n            }\n            continue;\n        }\n\n        if !has_upstream {\n            attempted_ops += 1;\n            out!(\"   plan: set upstream via `git push -u origin HEAD`\");\n            if apply {\n                match run_git_with_timeout(\n                    \u0026repo,\n                    \u0026[\"push\", \"-u\", \"origin\", \"HEAD\"],\n                    push_timeout_secs,\n                    \"push -u\",\n                )\n                .await\n                {\n                    Ok(()) =\u003e {\n                        succeeded_ops += 1;\n                        has_upstream = true;\n                        out!(\"   ok: upstream configured\");\n                        append_incident_record(\n                            policy_path,\n                            \u0026IncidentRecord {\n                                ts_unix: timestamp_secs(),\n                                scope: \"concern\".to_string(),\n                                repo: repo.display().to_string(),\n                                reason: reason.clone(),\n                                action: \"set_upstream_push_u\".to_string(),\n                                backup_branch: None,\n                                result: \"ok\".to_string(),\n                                details: None,\n                            },\n                        );\n                    }\n                    Err(e) =\u003e {\n                        out!(\"   fail: upstream configure failed: {}\", e);\n                        append_incident_record(\n                            policy_path,\n                            \u0026IncidentRecord {\n                                ts_unix: timestamp_secs(),\n                                scope: \"concern\".to_string(),\n                                repo: repo.display().to_string(),\n                                reason: reason.clone(),\n                                action: \"set_upstream_push_u\".to_string(),\n                                backup_branch: None,\n                                result: \"fail\".to_string(),\n                                details: Some(e.to_string()),\n                            },\n                        );\n                        continue;\n                    }\n                }\n            }\n        }\n\n        if status.behind \u003e 0 \u0026\u0026 has_upstream {\n            attempted_ops += 1;\n            out!(\"   plan: pull --rebase --autostash\");\n            if apply {\n                match run_git_with_timeout(\n                    \u0026repo,\n                    \u0026[\"pull\", \"--rebase\", \"--autostash\"],\n                    policy.pull_op_timeout_secs,\n                    \"pull/rebase\",\n                )\n                .await\n                {\n                    Ok(()) =\u003e {\n                        succeeded_ops += 1;\n                        out!(\"   ok: pulled\");\n                        append_incident_record(\n                            policy_path,\n                            \u0026IncidentRecord {\n                                ts_unix: timestamp_secs(),\n                                scope: \"concern\".to_string(),\n                                repo: repo.display().to_string(),\n                                reason: reason.clone(),\n                                action: \"pull_rebase_autostash\".to_string(),\n                                backup_branch: None,\n                                result: \"ok\".to_string(),\n                                details: None,\n                            },\n                        );\n                    }\n                    Err(e) =\u003e {\n                        out!(\"   fail: pull failed: {}\", e);\n                        append_incident_record(\n                            policy_path,\n                            \u0026IncidentRecord {\n                                ts_unix: timestamp_secs(),\n                                scope: \"concern\".to_string(),\n                                repo: repo.display().to_string(),\n                                reason: reason.clone(),\n                                action: \"pull_rebase_autostash\".to_string(),\n                                backup_branch: None,\n                                result: \"fail\".to_string(),\n                                details: Some(e.to_string()),\n                            },\n                        );\n                    }\n                }\n            }\n        }\n\n        if status.ahead \u003e 0 \u0026\u0026 has_upstream {\n            attempted_ops += 1;\n            out!(\"   plan: push origin HEAD\");\n            if apply {\n                let mut push_ok = false;\n                #[allow(unused_assignments)]\n                match push_with_retries(\u0026repo, push_timeout_secs, push_retries, \"push\").await {\n                    Ok(()) =\u003e {\n                        succeeded_ops += 1;\n                        push_ok = true;\n                        out!(\"   ok: pushed\");\n                        append_incident_record(\n                            policy_path,\n                            \u0026IncidentRecord {\n                                ts_unix: timestamp_secs(),\n                                scope: \"concern\".to_string(),\n                                repo: repo.display().to_string(),\n                                reason: reason.clone(),\n                                action: \"push_origin_head\".to_string(),\n                                backup_branch: None,\n                                result: \"ok\".to_string(),\n                                details: None,\n                            },\n                        );\n                    }\n                    Err(e) =\u003e {\n                        out!(\"   fail: push failed: {}\", e);\n\n                        let err_str = e.to_string().to_lowercase();\n                        \n                        // Check if push failed because remote doesn't exist or is unreachable\n                        // In this case, auto-create a private bare repo as the remote\n                        let no_remote = err_str.contains(\"no such remote\")\n                            || err_str.contains(\"remote does not exist\")\n                            || err_str.contains(\"repository not found\")\n                            || err_str.contains(\"could not resolve host\")\n                            || err_str.contains(\"does not appear to be a git repository\")\n                            || (err_str.contains(\"exit status: 128\") \u0026\u0026 err_str.contains(\"fatal:\"));\n\n                        if no_remote {\n                            // Try to create a private bare repo and use it as origin\n                            out!(\"   info: no remote detected, creating private bare repo\");\n                            if let Some(private_remote) = create_private_remote(\u0026repo) {\n                                out!(\"   info: created private remote: {}\", private_remote);\n                                // Retry push with new remote\n                                match push_with_retries(\u0026repo, push_timeout_secs, push_retries, \"push\").await {\n                                    Ok(()) =\u003e {\n                                        succeeded_ops += 1;\n                                        push_ok = true;\n                                        out!(\"   ok: pushed to private remote\");\n                                        append_incident_record(\n                                            policy_path,\n                                            \u0026IncidentRecord {\n                                                ts_unix: timestamp_secs(),\n                                                scope: \"concern\".to_string(),\n                                                repo: repo.display().to_string(),\n                                                reason: reason.clone(),\n                                                action: \"push_origin_head\".to_string(),\n                                                backup_branch: None,\n                                                result: \"ok\".to_string(),\n                                                details: Some(format!(\"pushed to private remote: {}\", private_remote)),\n                                            },\n                                        );\n                                        continue;\n                                    }\n                                    Err(e2) =\u003e {\n                                        out!(\"   fail: push to             );\n                                continue;\n                            }\n                        }\n\n                        // For permission denied or other errors on existing remote, \n                        // just record failure and continue - no permanent marking\n                        // These will retry on next cycle naturally\n                        append_incident_record(\n                            policy_path,\n                            \u0026IncidentRecord {\n                                ts_unix: timestamp_secs(),\n                                scope: \"concern\".to_string(),\n                                repo: repo.display().to_string(),\n                                reason: reason.clone(),\n                                action: \"push_origin_head\".to_string(),\n                                backup_branch: None,\n                                result: \"fail\".to_string(),\n                                details: Some(e.to_string()),\n                            },\n                        );\n                        // Don't continue here - let it fall through to large blob detection below\n                        // (but without the manual_only marking)\n\n                        let large = detect_large_blobs_ahead(\u0026repo, blob_threshold)\n                            .unwrap_or_default();\n                        if !large.is_empty() {\n                            out!(\n                                \"   detect: large blobs in ahead range ({} entries)\",\n                                large.len()\n                            );\n                            let mut dirs = BTreeSet::new();\n                            for (_, path) in \u0026large {\n                                if let Some(dir) = top_level_dir(path) {\n                                    if is_excluded_dir_name(\u0026dir, \u0026excluded_dir_names) {\n                                        dirs.insert(dir);\n lse, e.to_string())),\n            }\n        }\n        Ok((false, \"provider not found\".to_string()))\n    }\n\n    pub async fn chat(\u0026self, messages: Vec\u003cChatMessage\u003e) -\u003e Result\u003cString\u003e {\n        let mut last_error = None;\n\n        for pc in \u0026self.providers {\n            // Check provider health before calling\n            {\n                let health = provider_health().lock().await;\n                match health.get(\u0026pc.name) {\n                    Some(ProviderStatus::AuthFailed) =\u003e {\n                        continue;\n                    }\n                    Some(ProviderStatus::RateLimited { until }) =\u003e {\n                        if Instant::now() \u003c *until {\n                            continue;\n                        }\n                    }\n                    _ =\u003e {}\n                }\n            }\n\n            match self.call_provider(pc, messages.clone()).await {\n                Ok(content) =\u003e {\n                    provider_health().lock().await.insert(pc.name.clone(), ProviderStatus::Healthy);\n                    return Ok(content);\n                }\n                Err(e) =\u003e {\n                    let msg = e.to_string().to_lowercase();\n                    eprintln!(\"⚠️ AI {} failed: {}\", pc.name, e);\n                    let mut health = provider_health().lock().await;\n                    if msg.contains(\"401\") || msg.contains(\"403\") || msg.contains(\"unauthorized\") || msg.contains(\"api key\") {\n                        eprintln!(\"🔑 {}: auth error (skipping for session)\", pc.name);\n                        health.insert(pc.name.clone(), ProviderStatus::AuthFailed);\n                    } else if msg.contains(\"429\") || msg.contains(\"rate limit\") {\n                        eprintln!(\"⏳ {}: rate limited (skipping 60s)\", pc.name);\n                        health.insert(pc.name.clone(), ProviderStatus::RateLimited {\n                            until: Instant::now() + Duration::from_secs(60),\n                        });\n                    }\n                    last_error = Some(e);\n                }\n            }\n        }\n\n        Err(last_error.unwrap_or_else(|| anyhow::anyhow!(\"no AI providers available\")))\n    }\n\n    async fn call_provider(\u0026self, provider: \u0026ProviderConfig, messages: Vec\u003cChatMessage\u003e) -\u003e Result\u003cString\u003e {\n        let Some(api_key) = Self::get_api_key(\u0026provider.env) else {\n            anyhow::bail!(\"no API key for {}\", provider.env);\n        };\n\n        if provider.is_google_api {\n            return self.call_google_api(provider, \u0026api_key, messages).await;\n        }\n\n        let request_messages: Vec\u003cRequestMessage\u003e = messages.into_iter().map(|m| m.into()).collect();\n        let request = ChatRequest {\n            model: provider.model.clone(),\n            messages: request_messages,\n        };\n\n        let url = format!(\"{}/chat/completions\", provider.endpoint.trim_end_matches('/'));\n\n        let response = self\n            .client\n            .post(\u0026url)\n            .header(\u0026provider.auth_header, format!(\"{}{}\", provider.auth_prefix, api_key))\n            .json(\u0026request)\n            .timeout(std::time::Duration::from_secs(60))\n            .send()\n            .await\n            .context(\"request failed\")?;\n\n        let status = response.status();\n        if !status.is_success() {\n            let text = response.text().await.unwrap_or_default();\n            anyhow::bail!(\"{}: {} - {}\", status, text.chars().take(100).collect::\u003cString\u003e(), provider.name);\n        }\n\n        let chat_resp: ChatResponse = response.json().await.context(\"parse response\")?;\n\n        chat_resp\n            .choices\n            .first()\n            .map(|c| c.message.content.clone())\n            .context(\"no choices in response\")\n    }\n\n    async fn call_google_api(\u0026self, provider: \u0026ProviderConfig, api_key: \u0026str, messages: Vec\u003cChatMessage\u003e) -\u003e Result\u003cString\u003e {\n        #[derive(Serialize)]\n        struct GoogleRequest {\n            contents: Vec\u003cContent\u003e,\n        }\n\n        #[derive(Serialize)]\n        struct Content {\n            role: String,\n            parts: Vec\u003cPart\u003e,\n        }\n\n        #[derive(Serialize)]\n        struct Part {\n            text: String,\n        }\n\n        #[derive(Deserialize)]\n        struct GoogleResponse {\n            candidates: Vec\u003cCandidate\u003e,\n        }\n\n        #[derive(Deserialize)]\n        struct Candidate {\n            content: ContentResponse,\n        }\n\n        #[derive(Deserialize)]\n        struct ContentResponse {\n            parts: Vec\u003cTextPart\u003e,\n        }\n\n        #[derive(Deserialize)]\n        struct TextPart {\n            text: String,\n        }\n\n        let google_messages: Vec\u003cContent\u003e = messages\n            .into_iter()\n            .map(|m| Content {\n                role: if m.role == \"user\" { \"user\" } else { \"model\" }.to_string(),\n                parts: vec![Part { text: m.content }],\n            })\n            .collect();\n\n        let request = GoogleRequest {\n            contents: google_messages,\n        };\n\n        let url = format!(\n            \"{}/models/{}:generateContent?key={}\",\n            provider.endpoint.trim_end_matches('/'),\n            provider.model,\n            api_key\n        );\n\n        let response = self\n            .client\n            .post(\u0026url)\n            .header(\"Content-Type\", \"application/json\")\n            .json(\u0026request)\n            .timeout(std::time::Duration::from_secs(60))\n            .send()\n            .await\n            .context(\"google api request failed\")?;\n\n        let status = response.status();\n        if !status.is_success() {\n            let text = response.text().await.unwrap_or_default();\n            anyhow::bail!(\"Google API {}: {}\", status, text.chars().take(200).collect::\u003cString\u003e());\n        }\n\n        let google_resp: GoogleResponse = response.json().await.context(\"parse google response\")?;\n\n        google_resp\n            .candidates\n            .first()\n            .and_then(|c| c.content.parts.first())\n            .map(|p| p.text.clone())\n            .context(\"no text in google response\")\n    }\n}\n\nimpl Default for SimpleAiService {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}","traces":[{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":105,"address":[],"length":0,"stats":{"Line":0}},{"line":106,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":0}},{"line":108,"address":[],"length":0,"stats":{"Line":0}},{"line":109,"address":[],"length":0,"stats":{"Line":0}},{"line":110,"address":[],"length":0,"stats":{"Line":0}},{"line":111,"address":[],"length":0,"stats":{"Line":0}},{"line":112,"address":[],"length":0,"stats":{"Line":0}},{"line":113,"address":[],"length":0,"stats":{"Line":0}},{"line":118,"address":[],"length":0,"stats":{"Line":0}},{"line":119,"address":[],"length":0,"stats":{"Line":0}},{"line":120,"address":[],"length":0,"stats":{"Line":0}},{"line":121,"address":[],"length":0,"stats":{"Line":0}},{"line":123,"address" with_timeout, run_git_with_timeout, staged_paths,\n    unstage_excluded_paths, unstage_oversized_paths,\n};\nuse crate::policy::{debug_enabled, load_repo_override, SyncPolicy};\nuse crate::report::{build_commit_context, detect_report_signals, push_large_blob_threshold_bytes};\n\npub(crate) async fn sync_repo(\n    repo: \u0026Path,\n    policy: \u0026SyncPolicy,\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n    idle_seconds: u64,\n) -\u003e Result\u003cbool\u003e {\n    let svc = GitService::new(repo)?;\n    if !svc.is_git_repo().await? {\n        if debug_enabled() {\n            eprintln!(\"🐛 {} is not recognized as git repo\", repo.display());\n        }\n        return Ok(false);\n    }\n\n    // Bail out early if repo is in a conflict state - manual intervention required\n    if is_rebase_in_progress(repo) {\n        eprintln!(\"⚠️ {} has rebase in progress, skipping (manual intervention required)\", repo.display());\n        return Ok(false);\n    }\n    if is_merge_in_progress(repo) {\n        eprintln!(\"⚠️ {} has merge in progress, skipping (manual intervention required)\", repo.display());\n        return Ok(false);\n    }\n    if is_cherry_pick_in_progress(repo) {\n        eprintln!(\"⚠️ {} has cherry-pick in progress, skipping (manual intervention required)\", repo.display());\n        return Ok(false);\n    }\n\n    let has_origin = has_origin_remote(repo);\n    let has_upstream = has_tracking_upstream(repo);\n    let blob_threshold = push_large_blob_threshold_bytes(policy);\n    let initial_status = svc.get_status().await?;\n\n    // Optional per-repo overrides (untracked local settings).\n    // Path: `\u003crepo\u003e/.dracon/dracon-sync.toml`\n    let repo_override = load_repo_override(repo);\n    let auto_bump_versions = repo_override\n        .auto_bump_versions\n        .unwrap_or(policy.auto_bump_versions);\n\n    if policy.auto_pull \u0026\u0026 has_origin \u0026\u0026 has_upstream \u0026\u0026 initial_status.behind \u003e 0 \u0026\u0026 initial_status.is_clean {\n        match tokio::time::timeout(\n            Duration::from_secs(policy.pull_op_timeout_secs),\n            svc.pull_rebase(),\n        )\n        .await\n        {\n            Ok(Ok(())) =\u003e {}\n            Ok(Err(dracon_git::error::GitError::MergeConflict)) =\u003e {\n                eprintln!(\"⚠️ pull/rebase conflict in {} (manual intervention required)\", repo.display());\n                return Ok(false);\n            }\n            Ok(Err(e)) =\u003e {\n                eprintln!(\"⚠️ pull/rebase failed for {}: {} - aborting sync pass\", repo.display(), e);\n                return Ok(false);\n            }\n            Err(_) =\u003e {\n                eprintln!(\n                    \"⚠️ pull/rebase timeout for {} after {}s - aborting sync pass\",\n                    repo.display(),\n                    policy.pull_op_timeout_secs\n                );\n                return Ok(false);\n            }\n        }\n    } else if policy.auto_pull \u0026\u0026 has_origin \u0026\u0026 has_upstream \u0026\u0026 initial_status.behind == 0 {\n        if debug_enabled() {\n            eprintln!(\n                \"🐛 skip pull/rebase for {} (branch not behind upstream)\",\n                repo.display()\n            );\n        }\n    } else if policy.auto_pull \u0026\u0026 has_origin \u0026\u0026 has_upstream \u0026\u0026 !initial_status.is_clean {\n        if debug_enabled() {\n            eprintln!(\n                \"🐛 skip pull/rebase for {} (dirty repo, commit first)\",\n                repo.display()\n            );\n        }\n    } else if policy.auto_pull \u0026\u0026 !has_origin {\n        eprintln!(\n            \"ℹ️ skip pull/rebase for {} (no origin remote)\",\n            repo.display()\n        );\n    } else if policy.auto_pull \u0026\u0026 has_origin \u0026\u0026 !has_upstream {\n        eprintln!(\n            \"ℹ️ skip pull/rebase for {} (no tracking upstream on current branch)\",\n            repo.display(     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
</body>
</html>
