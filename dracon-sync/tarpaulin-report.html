<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        var data = {"files":[{"path":["/","home","dracon","Dev","dracon-utilities","dracon-sync","src","bump.rs"],"content":"use anyhow::{Context, Result};\nuse std::path::Path;\n\npub(crate) fn bump_semver_patch(ver: \u0026str) -\u003e Option\u003cString\u003e {\n    let parts: Vec\u003c\u0026str\u003e = ver.split('.').collect();\n    if parts.len() \u003c 3 {\n        return None;\n    }\n    if !parts[0].chars().all(|c| c.is_ascii_digit())\n        || !parts[1].chars().all(|c| c.is_ascii_digit())\n        || !parts[2].chars().all(|c| c.is_ascii_digit())\n    {\n        return None;\n    }\n    let major: u64 = parts[0].parse().ok()?;\n    let minor: u64 = parts[1].parse().ok()?;\n    let patch: u64 = parts[2].parse().ok()?;\n    Some(format!(\"{}.{}.{}\", major, minor, patch + 1))\n}\n\npub(crate) fn bump_semver_minor(ver: \u0026str) -\u003e Option\u003cString\u003e {\n    let parts: Vec\u003c\u0026str\u003e = ver.split('.').collect();\n    if parts.len() \u003c 3 {\n        return None;\n    }\n    if !parts[0].chars().all(|c| c.is_ascii_digit())\n        || !parts[1].chars().all(|c| c.is_ascii_digit())\n        || !parts[2].chars().all(|c| c.is_ascii_digit())\n    {\n        return None;\n    }\n    let major: u64 = parts[0].parse().ok()?;\n    let minor: u64 = parts[1].parse().ok()?;\n    let patch: u64 = parts[2].parse().ok()?;\n    Some(format!(\"{}.{}.{}\", major, minor + 1, 0))\n}\n\npub(crate) fn bump_semver_major(ver: \u0026str) -\u003e Option\u003cString\u003e {\n    let parts: Vec\u003c\u0026str\u003e = ver.split('.').collect();\n    if parts.len() \u003c 3 {\n        return None;\n    }\n    if !parts[0].chars().all(|c| c.is_ascii_digit())\n        || !parts[1].chars().all(|c| c.is_ascii_digit())\n        || !parts[2].chars().all(|c| c.is_ascii_digit())\n    {\n        return None;\n    }\n    let major: u64 = parts[0].parse().ok()?;\n    let minor: u64 = parts[1].parse().ok()?;\n    let patch: u64 = parts[2].parse().ok()?;\n    Some(format!(\"{}.{}.{}\", major + 1, 0, 0))\n}\n\npub(crate) fn bump_first_json_string_field(\n    content: \u0026str,\n    key: \u0026str,\n) -\u003e Option\u003c(String, String, String)\u003e {\n    // Tiny, formatting-preserving bump helper:\n    // finds the first `\"key\": \"x.y.z\"` occurrence and bumps patch.\n    let needle = format!(\"\\\"{}\\\"\", key);\n    let mut start = 0usize;\n    while let Some(idx) = content[start..].find(\u0026needle) {\n        let key_pos = start + idx;\n        let after_key = key_pos + needle.len();\n        let rest = \u0026content[after_key..];\n        let colon_rel = rest.find(':')?;\n        let after_colon = after_key + colon_rel + 1;\n        let rest2 = \u0026content[after_colon..];\n        let q1_rel = rest2.find('\"')?;\n        let q1 = after_colon + q1_rel + 1;\n        let rest3 = \u0026content[q1..];\n        let q2_rel = rest3.find('\"')?;\n        let q2 = q1 + q2_rel;\n        let old_ver = \u0026content[q1..q2];\n        if let Some(new_ver) = bump_semver_patch(old_ver) {\n            let mut out = String::with_capacity(content.len());\n            out.push_str(\u0026content[..q1]);\n            out.push_str(\u0026new_ver);\n            out.push_str(\u0026content[q2..]);\n            return Some((out, old_ver.to_string(), new_ver));\n        }\n        start = after_key;\n    }\n    None\n}\n\npub(crate) fn set_first_json_string_field_to_value(\n    content: \u0026str,\n    key: \u0026str,\n    expected_old: \u0026str,\n    new_value: \u0026str,\n) -\u003e Option\u003cString\u003e {\n    let needle = format!(\"\\\"{}\\\"\", key);\n    let mut start = 0usize;\n    while let Some(idx) = content[start..].find(\u0026needle) {\n        let key_pos = start + idx;\n        let after_key = key_pos + needle.len();\n        let rest = \u0026content[after_key..];\n        let colon_rel = rest.find(':')?;\n        let after_colon = after_key + colon_rel + 1;\n        let rest2 = \u0026content[after_colon..];\n        let q1_rel = rest2.find('\"')?;\n        let q1 = after_colon + q1_rel + 1;\n        let rest3 = \u0026content[q1..];\n        let q2_rel = rest3.find('\"')?;\n        let q2 = q1 + q2_rel;\n        let old = \u0026content[q1..q2];\n        if old == expected_old {\n            let mut out = String::with_capacity(content.len());\n            out.push_str(\u0026content[..q1]);\n            out.push_str(new_value);\n            out.push_str(\u0026content[q2..]);\n            return Some(out);\n        }\n        start = after_key;\n    }\n    None\n}\n\n#[derive(Debug, Clone, Copy)]\npub(crate) struct BumpOutcome {\n    pub bumped_cargo_toml: bool,\n    pub updated_cargo_lock: bool,\n    pub bumped_workspace_package: bool,\n}\n\npub(crate) fn bump_patch_version_in_repo(repo: \u0026Path) -\u003e Result\u003cBumpOutcome\u003e {\n    fn bump_in_section(content: \u0026str, target_section: \u0026str) -\u003e Option\u003c(String, String)\u003e {\n        let mut out = String::with_capacity(content.len() + 16);\n        let mut section = String::new();\n        let mut changed = false;\n        let mut new_version = String::new();\n\n        for raw in content.split_inclusive('\\n') {\n            let line = raw.trim_end_matches('\\n');\n            let newline = if raw.ends_with('\\n') { \"\\n\" } else { \"\" };\n            let trimmed = line.trim();\n\n            if trimmed.starts_with('[') \u0026\u0026 trimmed.ends_with(']') {\n                section = trimmed.trim_matches(\u0026['[', ']'][..]).trim().to_string();\n                out.push_str(line);\n                out.push_str(newline);\n                continue;\n            }\n\n            if !changed \u0026\u0026 section == target_section {\n                // Match `version = \"x.y.z\"` only inside the target section.\n                if let Some(rest) = trimmed.strip_prefix(\"version\") {\n                    let rest = rest.trim_start();\n                    if let Some(rest) = rest.strip_prefix('=') {\n                        let rest = rest.trim_start();\n                        if let Some((_, after_q1)) = rest.split_once('\"') {\n                            if let Some((ver, after_q2)) = after_q1.split_once('\"') {\n                                let parts: Vec\u003c\u0026str\u003e = ver.split('.').collect();\n                                if parts.len() \u003e= 3\n                                    \u0026\u0026 parts[0].chars().all(|c| c.is_ascii_digit())\n                                    \u0026\u0026 parts[1].chars().all(|c| c.is_ascii_digit())\n                                    \u0026\u0026 parts[2].chars().all(|c| c.is_ascii_digit())\n                                {\n                                    let major: u64 = parts[0].parse().ok()?;\n                                    let minor: u64 = parts[1].parse().ok()?;\n                                    let patch: u64 = parts[2].parse().ok()?;\n                                    new_version = format!(\"{}.{}.{}\", major, minor, patch + 1);\n\n                                    // Reconstruct preserving indentation and any trailing comment.\n                                    let indent: String =\n                                        line.chars().take_while(|c| c.is_whitespace()).collect();\n                                    out.push_str(\u0026indent);\n                                    out.push_str(\"version = \\\"\");\n                                    out.push_str(\u0026new_version);\n                                    out.push('\"');\n                                    out.push_str(after_q2);\n                                    out.push_str(newline);\n                                    changed = true;\n                                    continue;\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n\n            out.push_str(line);\n            out.push_str(newline);\n        }\n\n        if changed {\n            Some((out, new_version))\n        } else {\n            None\n        }\n    }\n\n    fn find_package_name(content: \u0026str, target_section: \u0026str) -\u003e Option\u003cString\u003e {\n        let mut section = String::new();\n        for raw in content.split_inclusive('\\n') {\n            let line = raw.trim_end_matches('\\n');\n            let trimmed = line.trim();\n            if trimmed.starts_with('[') \u0026\u0026 trimmed.ends_with(']') {\n                section = trimmed.trim_matches(\u0026['[', ']'][..]).trim().to_string();\n                continue;\n            }\n            if section != target_section {\n                continue;\n            }\n            if let Some(rest) = trimmed.strip_prefix(\"name\") {\n                let rest = rest.trim_start();\n                if let Some(rest) = rest.strip_prefix('=') {\n                    let value = rest.trim();\n                    if let Some(s) = value.strip_prefix('\"').and_then(|v| v.strip_suffix('\"')) {\n                        return Some(s.to_string());\n                    }\n                }\n            }\n        }\n        None\n    }\n\n    fn update_cargo_lock_package_version(\n        repo: \u0026Path,\n        package_name: \u0026str,\n        new_version: \u0026str,\n    ) -\u003e Result\u003cbool\u003e {\n        let lock_path = repo.join(\"Cargo.lock\");\n        let Ok(content) = std::fs::read_to_string(\u0026lock_path) else {\n            return Ok(false);\n        };\n\n        let mut out = String::with_capacity(content.len());\n        let mut in_pkg = false;\n        let mut name_matches = false;\n        let mut changed = false;\n\n        for raw in content.split_inclusive('\\n') {\n            let line = raw.trim_end_matches('\\n');\n            let newline = if raw.ends_with('\\n') { \"\\n\" } else { \"\" };\n            let trimmed = line.trim();\n\n            if trimmed == \"[[package]]\" {\n                in_pkg = true;\n                name_matches = false;\n                out.push_str(line);\n                out.push_str(newline);\n                continue;\n            }\n\n            if in_pkg {\n                if let Some(rest) = trimmed.strip_prefix(\"name\") {\n                    let rest = rest.trim_start();\n                    if let Some(rest) = rest.strip_prefix('=') {\n                        let value = rest.trim();\n                        if let Some(s) = value.strip_prefix('\"').and_then(|v| v.strip_suffix('\"')) {\n                            name_matches = s == package_name;\n                        }\n                    }\n                    out.push_str(line);\n                    out.push_str(newline);\n                    continue;\n                }\n            }\n\n            if in_pkg \u0026\u0026 name_matches \u0026\u0026 trimmed.starts_with(\"version\") {\n                let rest = trimmed[\"version\".len()..].trim_start();\n                if rest.starts_with('=') {\n                    let replacement = format!(\"version = \\\"{}\\\"\", new_version);\n                    if trimmed != replacement {\n                        changed = true;\n                        out.push_str(\u0026replacement);\n                        out.push_str(newline);\n                        continue;\n                    }\n                }\n            }\n\n            out.push_str(line);\n            out.push_str(newline);\n        }\n\n        if changed {\n            std::fs::write(\u0026lock_path, out)\n                .with_context(|| format!(\"failed writing {}\", lock_path.display()))?;\n        }\n        Ok(changed)\n    }\n\n    let cargo = repo.join(\"Cargo.toml\");\n    let Ok(content) = std::fs::read_to_string(\u0026cargo) else {\n        return Ok(BumpOutcome {\n            bumped_cargo_toml: false,\n            updated_cargo_lock: false,\n            bumped_workspace_package: false,\n        });\n    };\n\n    // Prefer workspace versioning when present.\n    let (next, new_ver, bumped_section) =\n        if let Some((next, v)) = bump_in_section(\u0026content, \"workspace.package\") {\n            (next, v, \"workspace.package\")\n        } else if let Some((next, v)) = bump_in_section(\u0026content, \"package\") {\n            (next, v, \"package\")\n        } else {\n            return Ok(BumpOutcome {\n                bumped_cargo_toml: false,\n                updated_cargo_lock: false,\n                bumped_workspace_package: false,\n            });\n        };\n\n    if next == content {\n        return Ok(BumpOutcome {\n            bumped_cargo_toml: false,\n            updated_cargo_lock: false,\n            bumped_workspace_package: false,\n        });\n    }\n\n    std::fs::write(\u0026cargo, next).with_context(|| format!(\"failed writing {}\", cargo.display()))?;\n\n    // Keep Cargo.lock consistent for single-package repos: if we can find the package name in\n    // the same bumped section (typically [package]), update the matching lock entry's version.\n    let mut updated_cargo_lock = false;\n    if bumped_section == \"package\" \u0026\u0026 !new_ver.is_empty() {\n        if let Some(name) = find_package_name(\u0026content, \"package\") {\n            match update_cargo_lock_package_version(repo, \u0026name, \u0026new_ver) {\n                Ok(changed) =\u003e updated_cargo_lock = changed,\n                Err(e) =\u003e eprintln!(\n                    \"⚠️ failed to update Cargo.lock for {}: {}\",\n                    repo.display(),\n                    e\n                ),\n            }\n        }\n    }\n\n    Ok(BumpOutcome {\n        bumped_cargo_toml: true,\n        updated_cargo_lock,\n        bumped_workspace_package: bumped_section == \"workspace.package\",\n    })\n}\n\n#[derive(Debug, Clone, Copy)]\npub(crate) struct SimpleBumpOutcome {\n    pub bumped: bool,\n    pub updated_lock: bool,\n}\n\npub(crate) fn bump_node_package_version_in_repo(repo: \u0026Path) -\u003e Result\u003cSimpleBumpOutcome\u003e {\n    let pkg = repo.join(\"package.json\");\n    let Ok(content) = std::fs::read_to_string(\u0026pkg) else {\n        return Ok(SimpleBumpOutcome {\n            bumped: false,\n            updated_lock: false,\n        });\n    };\n    let Some((next, old_ver, new_ver)) = bump_first_json_string_field(\u0026content, \"version\") else {\n        return Ok(SimpleBumpOutcome {\n            bumped: false,\n            updated_lock: false,\n        });\n    };\n    if next != content {\n        std::fs::write(\u0026pkg, next).with_context(|| format!(\"failed writing {}\", pkg.display()))?;\n    }\n\n    // Best-effort: keep package-lock.json root version aligned if it matches the old version.\n    let mut updated_lock = false;\n    let lock = repo.join(\"package-lock.json\");\n    if let Ok(lock_content) = std::fs::read_to_string(\u0026lock) {\n        if let Some(lock_next) =\n            set_first_json_string_field_to_value(\u0026lock_content, \"version\", \u0026old_ver, \u0026new_ver)\n        {\n            if lock_next != lock_content {\n                std::fs::write(\u0026lock, lock_next)\n                    .with_context(|| format!(\"failed writing {}\", lock.display()))?;\n                updated_lock = true;\n            }\n        }\n    }\n\n    Ok(SimpleBumpOutcome {\n        bumped: true,\n        updated_lock,\n    })\n}\n\npub(crate) fn bump_version_file_in_repo(repo: \u0026Path) -\u003e Result\u003cbool\u003e {\n    let p = repo.join(\"VERSION\");\n    let Ok(content) = std::fs::read_to_string(\u0026p) else {\n        return Ok(false);\n    };\n    let raw = content.trim();\n    let Some(new_ver) = bump_semver_patch(raw) else {\n        return Ok(false);\n    };\n    let next = format!(\"{}\\n\", new_ver);\n    if next != content {\n        std::fs::write(\u0026p, next).with_context(|| format!(\"failed writing {}\", p.display()))?;\n        return Ok(true);\n    }\n    Ok(false)\n}\n\n#[derive(Debug, Clone, Copy, PartialEq)]\npub enum BumpLevel {\n    Major,\n    Minor,\n    Patch,\n    None,\n}\n\nimpl BumpLevel {\n    pub fn as_str(\u0026self) -\u003e \u0026'static str {\n        match self {\n            BumpLevel::Major =\u003e \"major\",\n            BumpLevel::Minor =\u003e \"minor\",\n            BumpLevel::Patch =\u003e \"patch\",\n            BumpLevel::None =\u003e \"none\",\n        }\n    }\n}\n\nconst NOISE_PATTERNS: \u0026[\u0026str] = \u0026[\n    \".md\",\n    \".txt\",\n    \".yml\",\n    \".yaml\",\n    \".toml\",\n    \"LICENSE\",\n    \"README\",\n    \"CHANGELOG\",\n    \"CONTRIBUTING\",\n    \".github/\",\n    \".gitignore\",\n    \".cargo/config\",\n    \"rustfmt\",\n    \"clippy\",\n    \"deny.toml\",\n    \".vscode/\",\n    \".idea/\",\n    \"package-lock.json\",\n    \"Cargo.lock\",\n    \".env\",\n    \".env.example\",\n    \".editorconfig\",\n    \".shellcheckrc\",\n];\n\nconst VERSION_FILES: \u0026[\u0026str] = \u0026[\n    \"Cargo.toml\",\n    \"package.json\",\n    \"VERSION\",\n    \"Cargo.lock\",\n];\n\npub fn deterministic_decide_bump_level(staged_diff: \u0026str) -\u003e BumpLevel {\n    let mut has_meaningful_change = false;\n\n    for line in staged_diff.lines().filter(|l| !l.is_empty()) {\n        let is_version_file = VERSION_FILES.iter().any(|p| line.contains(p));\n        let is_noise = NOISE_PATTERNS.iter().any(|p| line.contains(p));\n\n        if is_version_file {\n            continue;\n        }\n        if is_noise {\n            continue;\n        }\n        has_meaningful_change = true;\n        break;\n    }\n\n    if has_meaningful_change {\n        BumpLevel::Patch\n    } else {\n        BumpLevel::None\n    }\n}\n\npub fn read_current_version(repo: \u0026Path) -\u003e Option\u003cString\u003e {\n    if let Ok(cargo) = std::fs::read_to_string(repo.join(\"Cargo.toml\")) {\n        if let Some(version) = extract_version_from_cargo(\u0026cargo) {\n            return Some(version);\n        }\n    }\n    if let Ok(pkg) = std::fs::read_to_string(repo.join(\"package.json\")) {\n        if let Some(version) = extract_version_from_json(\u0026pkg, \"version\") {\n            return Some(version);\n        }\n    }\n    if let Ok(version_file) = std::fs::read_to_string(repo.join(\"VERSION\")) {\n        let trimmed = version_file.trim();\n        if !trimmed.is_empty() {\n            return Some(trimmed.to_string());\n        }\n    }\n    None\n}\n\nfn extract_version_from_cargo(content: \u0026str) -\u003e Option\u003cString\u003e {\n    let mut section = String::new();\n    for line in content.lines() {\n        let trimmed = line.trim();\n        if trimmed.starts_with('[') \u0026\u0026 trimmed.ends_with(']') {\n            section = trimmed.trim_matches(\u0026['[', ']'][..]).trim().to_string();\n        }\n        if section == \"package\" || section == \"workspace.package\" {\n            if let Some(rest) = trimmed.strip_prefix(\"version\") {\n                let rest = rest.trim_start().trim_start_matches('=').trim();\n                if let Some(v) = rest.strip_prefix('\"').and_then(|s| s.strip_suffix('\"')) {\n                    return Some(v.to_string());\n                }\n            }\n        }\n    }\n    None\n}\n\nfn extract_version_from_json(content: \u0026str, key: \u0026str) -\u003e Option\u003cString\u003e {\n    let needle = format!(\"\\\"{}\\\"\", key);\n    let mut start = 0usize;\n    while let Some(idx) = content[start..].find(\u0026needle) {\n        let key_pos = start + idx;\n        let after_key = key_pos + needle.len();\n        let rest = \u0026content[after_key..];\n        let colon_rel = rest.find(':')?;\n        let after_colon = after_key + colon_rel + 1;\n        let rest2 = \u0026content[after_colon..];\n        let q1_rel = rest2.find('\"')?;\n        let q1 = after_colon + q1_rel + 1;\n        let rest3 = \u0026content[q1..];\n        let q2_rel = rest3.find('\"')?;\n        let q2 = q1 + q2_rel;\n        return Some(content[q1..q2].to_string());\n    }\n    None\n}\n\n\n#[cfg(feature = \"ai-bumper\")]\npub async fn ai_decide_bump_level(\n    _repo: \u0026Path,\n    current_version: \u0026str,\n    staged_diff: \u0026str,\n    project_state: \u0026str,\n) -\u003e BumpLevel {\n    use crate::simple_ai::{ChatMessage, SimpleAiService};\n\n    let version_only_patterns = [\"Cargo.toml\", \"package.json\", \"VERSION\", \"Cargo.lock\"];\n    let has_source_changes = staged_diff.lines()\n        .filter(|line| !line.is_empty())\n        .any(|line| {\n            !version_only_patterns.iter().any(|p| line.contains(p))\n        });\n\n    if !has_source_changes {\n        return BumpLevel::None;\n    }\n\n    let prompt = format!(r##\"You are a version bump advisor. Analyze the changes and decide if a version bump is warranted.\n\nCurrent Version: {current_version}\n\nProject State:\n{project_state}\n\nStaged Changes:\n{staged_diff}\n\nRespond with ONLY ONE WORD:\n- \"major\": BREAKING CHANGE\n- \"minor\": NEW FEATURE  \n- \"patch\": BUG FIX / improvement\n- \"none\": NOISY/CHORE (docs, deps, config only)\n\nRespond with ONLY ONE WORD.\"##);\n\n    let service = SimpleAiService::new();\n    if service.is_empty() {\n        return BumpLevel::None;\n    }\n\n    let messages = vec![ChatMessage::user(\u0026prompt)];\n\n    match service.chat(messages).await {\n        Ok(content) =\u003e {\n            match content.trim().to_lowercase().as_str() {\n                \"major\" =\u003e BumpLevel::Major,\n                \"minor\" =\u003e BumpLevel::Minor,\n                \"patch\" =\u003e BumpLevel::Patch,\n                _ =\u003e BumpLevel::None,\n            }\n        }\n        Err(_) =\u003e BumpLevel::None,\n    }\n}\n\npub fn apply_version_bump_to_repo(repo: \u0026Path, old_ver: \u0026str, new_ver: \u0026str) -\u003e bool {\n    if repo.join(\"Cargo.toml\").exists() {\n        if let Ok(content) = std::fs::read_to_string(repo.join(\"Cargo.toml\")) {\n            let bumped = bump_version_in_cargo_toml(\u0026content, old_ver, new_ver);\n            if bumped != content {\n                if std::fs::write(repo.join(\"Cargo.toml\"), bumped).is_ok() {\n                    return true;\n                }\n            }\n        }\n    }\n    if repo.join(\"package.json\").exists() {\n        if let Ok(content) = std::fs::read_to_string(repo.join(\"package.json\")) {\n            let bumped = bump_version_in_json(\u0026content, old_ver, new_ver);\n            if bumped != content {\n                if std::fs::write(repo.join(\"package.json\"), bumped).is_ok() {\n                    return true;\n                }\n            }\n        }\n    }\n    if repo.join(\"VERSION\").exists() {\n        if std::fs::write(repo.join(\"VERSION\"), format!(\"{}\\n\", new_ver)).is_ok() {\n            return true;\n        }\n    }\n    false\n}\n\nfn bump_version_in_cargo_toml(content: \u0026str, old_ver: \u0026str, new_ver: \u0026str) -\u003e String {\n    content.replace(\u0026format!(\"version = \\\"{}\\\"\", old_ver), \u0026format!(\"version = \\\"{}\\\"\", new_ver))\n        .replace(\u0026format!(\"version=\\\"{}\\\"\", old_ver), \u0026format!(\"version=\\\"{}\\\"\", new_ver))\n}\n\nfn bump_version_in_json(content: \u0026str, old_ver: \u0026str, new_ver: \u0026str) -\u003e String {\n    content.replace(\u0026format!(\"\\\"version\\\": \\\"{}\\\"\", old_ver), \u0026format!(\"\\\"version\\\": \\\"{}\\\"\", new_ver))\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_bump_semver_patch() {\n        assert_eq!(bump_semver_patch(\"1.2.3\"), Some(\"1.2.4\".to_string()));\n        assert_eq!(bump_semver_patch(\"0.0.0\"), Some(\"0.0.1\".to_string()));\n        assert_eq!(bump_semver_patch(\"v1.2.3\"), None);\n        assert_eq!(bump_semver_patch(\"1.2\"), None);\n    }\n\n    #[test]\n    fn test_bump_semver_minor() {\n        assert_eq!(bump_semver_minor(\"1.2.3\"), Some(\"1.3.0\".to_string()));\n        assert_eq!(bump_semver_minor(\"0.0.0\"), Some(\"0.1.0\".to_string()));\n    }\n\n    #[test]\n    fn test_bump_semver_major() {\n        assert_eq!(bump_semver_major(\"1.2.3\"), Some(\"2.0.0\".to_string()));\n        assert_eq!(bump_semver_major(\"0.9.9\"), Some(\"1.0.0\".to_string()));\n    }\n\n    #[test]\n    fn test_bump_semver_edge_cases() {\n        assert_eq!(bump_semver_patch(\"10.20.30\"), Some(\"10.20.31\".to_string()));\n        assert_eq!(bump_semver_minor(\"10.20.30\"), Some(\"10.21.0\".to_string()));\n        assert_eq!(bump_semver_major(\"10.20.30\"), Some(\"11.0.0\".to_string()));\n    }\n\n    #[test]\n    fn test_bump_semver_invalid_inputs() {\n        assert_eq!(bump_semver_patch(\"1.2\"), None);\n        assert_eq!(bump_semver_patch(\"v1.2.3\"), None);\n        assert_eq!(bump_semver_patch(\"1.a.3\"), None);\n        assert_eq!(bump_semver_patch(\"\"), None);\n        assert_eq!(bump_semver_patch(\"1.2.3-alpha\"), None);\n        assert_eq!(bump_semver_minor(\"1.2\"), None);\n        assert_eq!(bump_semver_minor(\"v1.2.3\"), None);\n        assert_eq!(bump_semver_major(\"1.2\"), None);\n        assert_eq!(bump_semver_major(\"v1.2.3\"), None);\n    }\n\n    #[test]\n    fn test_bump_semver_leading_v_rejected() {\n        assert_eq!(bump_semver_patch(\"v1.2.3\"), None);\n        assert_eq!(bump_semver_minor(\"v1.2.3\"), None);\n        assert_eq!(bump_semver_major(\"v1.2.3\"), None);\n    }\n\n    #[test]\n    fn test_bump_semver_zero_versions() {\n        assert_eq!(bump_semver_patch(\"0.0.1\"), Some(\"0.0.2\".to_string()));\n        assert_eq!(bump_semver_minor(\"0.0.1\"), Some(\"0.1.0\".to_string()));\n        assert_eq!(bump_semver_major(\"0.0.1\"), Some(\"1.0.0\".to_string()));\n    }\n}\n","traces":[{"line":4,"address":[],"length":0,"stats":{"Line":12}},{"line":5,"address":[],"length":0,"stats":{"Line":60}},{"line":6,"address":[],"length":0,"stats":{"Line":12}},{"line":7,"address":[],"length":0,"stats":{"Line":3}},{"line":9,"address":[],"length":0,"stats":{"Line":38}},{"line":10,"address":[],"length":0,"stats":{"Line":26}},{"line":11,"address":[],"leng how::Result;\nuse dracon_git::GitService;\nuse std::collections::{BTreeSet, HashMap};\nuse std::path::{Path, PathBuf};\nuse std::time::{Duration, Instant};\nuse tokio::time::sleep;\n\nuse crate::policy::{SyncPolicy, freeze_reason, debug_enabled, timestamp_secs};\nuse crate::exclude::{excluded_dir_names_set, has_sync_relevant_dirty_entries};\nuse crate::git::{discover_git_repos, repo_diff_entries, has_origin_remote, has_tracking_upstream, has_both_main_and_master};\nuse crate::git::{consolidate_to_master, rename_main_to_master};\nuse crate::report::{ConcernRepairFilter, RepairSummary, run_repair_concerns, run_repair_warns};\nuse crate::sync::sync_repo;\n\nconst STUCK_REPO_EXPIRY_SECS: u64 = 24 * 60 * 60; // 24 hours\n\n#[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]\nstruct StuckRepoEntry {\n    path: PathBuf,\n    stuck_since: u64,\n}\n\nfn stuck_repos_path() -\u003e PathBuf {\n    dirs::home_dir()\n        .unwrap_or_else(|| PathBuf::from(\".\"))\n        .join(\".dracon\")\n        .join(\"state\")\n        .join(\"dracon-sync-stuck-push-repos.json\")\n}\n\nfn load_stuck_push_repos() -\u003e HashMap\u003cPathBuf, u64\u003e {\n    let path = stuck_repos_path();\n    if !path.exists() {\n        return HashMap::new();\n    }\n    let content = match std::fs::read_to_string(\u0026path) {\n        Ok(c) =\u003e c,\n        Err(e) =\u003e {\n            eprintln!(\"⚠️ failed reading stuck repos ({}): {}\", path.display(), e);\n            return HashMap::new();\n        }\n    };\n    let entries: Vec\u003cStuckRepoEntry\u003e = serde_json::from_str(\u0026content).unwrap_or_else(|e| {\n        eprintln!(\"⚠️ failed parsing stuck repos ({}): {}\", path.display(), e);\n        Vec::new()\n    });\n    let now = timestamp_secs();\n    let cutoff = now.saturating_sub(STUCK_REPO_EXPIRY_SECS);\n    entries\n        .into_iter()\n        .filter(|e| e.stuck_since \u003e cutoff)\n        .map(|e| (e.path, e.stuck_since))\n        .collect()\n}\n\nfn save_stuck_push_repos(repos: \u0026HashMap\u003cPathBuf, u64\u003e) {\n    let path = stuck_repos_path();\n    if let Some(parent) = path.parent() {\n        if !parent.exists() {\n            if let Err(e) = std::fs::create_dir_all(parent) {\n                eprintln!(\"⚠️ failed creating stuck repos dir: {}\", e);\n                return;\n            }\n        }\n    }\n    let entries: Vec\u003cStuckRepoEntry\u003e = repos\n        .iter()\n        .map(|(p, t)| StuckRepoEntry { path: p.clone(), stuck_since: *t })\n        .collect();\n    let content = serde_json::to_string_pretty(\u0026entries).unwrap_or_else(|e| {\n        eprintln!(\"⚠️ failed serializing stuck repos: {}\", e);\n        String::new()\n    });\n    if content.is_empty() {\n        return;\n    }\n    let tmp_path = path.with_extension(\"tmp\");\n    if let Err(e) = std::fs::write(\u0026tmp_path, \u0026content) {\n        eprintln!(\"⚠️ failed writing stuck repos tmp ({}): {}\", tmp_path.display(), e);\n        let _ = std::fs::remove_file(\u0026tmp_path);\n        return;\n    }\n    if let Err(e) = std::fs::rename(\u0026tmp_path, \u0026path) {\n        eprintln!(\"⚠️ failed renaming stuck repos ({}): {}\", path.display(), e);\n        let _ = std::fs::remove_file(\u0026tmp_path);\n    }\n}\n\npub(crate) fn unstuck_repo(repo: \u0026Path) -\u003e bool {\n    let path = stuck_repos_path();\n    if !path.exists() {\n        return false;\n    }\n    let mut repos = load_stuck_push_repos();\n    if repos.remove(repo).is_some() {\n        save_stuck_push_repos(\u0026repos);\n        println!(\"🔓 unstuck: {}\", repo.display());\n        true\n    } else {\n        println!(\"ℹ️ {} not in stuck repos\", repo.display());\n        false\n    }\n}\n\npub(crate) fn list_stuck_repos() {\n    let repos = load_stuck_push_repos();\n    if repos.is_empty() {\n        println!(\"✅ no stuck repos\");\n        return;\n    }\n    println!(\"🔒 stuck repos (expire after 24h):\");\n    let now = timestamp_secs();\n    for (path, since) in repos {\n        let age_hrs = (now.saturating_sub(since)) / 3600;\n        println!(\"   {} ({}h ago)\", path.display(), age_hrs);\n    }\n}\n\npub(crate) fn is_repo_stuck(repo: \u0026Path) -\u003e bool {\n    load_stuck_push_repos().contains_key(repo)\n}\n\n/// Get the list of files that actually differ from HEAD (filter-aware).\n/// Unlike `git status`, `git diff HEAD` applies clean filters and correctly\n/// ignores files that only differ due to smudge filter decryption.\nasync fn git_diff_head_files(repo: \u0026Path) -\u003e Vec\u003cString\u003e {\n    let repo = repo.to_path_buf();\n    let result = tokio::time::timeout(\n        Duration::from_secs(30),\n        tokio::task::spawn_blocking(move || {\n            let output = std::process::Command::new(\"git\")\n                .current_dir(\u0026repo)\n                .args([\"diff\", \"HEAD\", \"--name-only\", \"-z\"])\n                .output();\n            let Ok(out) = output else { return Vec::new() };\n            String::from_utf8_lossy(\u0026out.stdout)\n                .split('\\0')\n                .filter(|s| !s.is_empty())\n                .map(String::from)\n                .collect()\n        }),\n    ).await;\n    match result {\n        Ok(Ok(files)) =\u003e files,\n        _ =\u003e Vec::new(), // timeout or join error - skip filter, let dirty detection proceed\n    }\n}\n\npub(crate) async fn run_once(policy_path: \u0026Path) -\u003e Result\u003c()\u003e {\n    if let Some(reason) = freeze_reason(policy_path) {\n        println!(\"⏸️ sync frozen ({})\", reason);\n        return Ok(());\n    }\n\n    let policy = SyncPolicy::load(policy_path)?;\n    let roots = policy.watch_root_paths();\n    let excluded_dir_names = excluded_dir_names_set(\u0026policy);\n    let repos = discover_git_repos(\u0026roots, \u0026excluded_dir_names, \u0026policy.exclude_repos);\n\n    let mut changed = 0usize;\n    for repo in repos {\n        match tokio::time::timeout(\n            Duration::from_secs(policy.repo_sync_timeout_secs),\n            sync_repo(\u0026repo, \u0026policy, \u0026excluded_dir_names, 0),\n        )\n        .await\n        {\n            Err(_) =\u003e {\n                eprintln!(\n                    \"⚠️ repo sync timeout for {} after {}s\",\n                    repo.display(),\n                    policy.repo_sync_timeout_secs\n                );\n            }\n            Ok(Ok(true)) =\u003e {\n                changed += 1;\n                println!(\"🔁 synced {}\", repo.display());\n            }\n            Ok(Ok(false)) =\u003e {}\n            Ok(Err(e)) =\u003e {\n                eprintln!(\"⚠️ sync failed for {}: {}\", repo.display(), e);\n            }\n        }\n    }\n\n    println!(\"✅ sync pass complete (repos changed: {})\", changed);\n    if policy.auto_repair_concerns {\n        if let Err(e) = run_repair_concerns(\n            policy_path,\n            true,\n            None,\n            Some(policy.push_op_timeout_secs),\n            policy.push_retries,\n            policy.auto_rewrite_large_blobs,\n            ConcernRepairFilter::All,\n            false,\n        )\n        .await\n        {\n            eprintln!(\"⚠️ auto-repair concerns failed: {}\", e);\n        }\n    }\n    if policy.auto_repair_warns {\n        if let Err(e) = run_repair_warns(policy_path, true, None, false).await {\n            eprintln!(\"⚠️ auto-repair warns failed: {}\", e);\n        }\n    }\n    Ok(())\n}\n\npub(crate) async fn run_daemon(policy_path: PathBuf) -\u003e Result\u003c()\u003e {\n    #[derive(Debug, Clone)]\n    struct RepoActivity {\n        fingerprint: String,\n        changed_at: Instant,\n        failure_count: usize,\n    }\n\n    let mut activity: HashMap\u003cPathBuf, RepoActivity\u003e = HashMap::new();\n    let mut repair_cooldowns: HashMap\u003cPathBuf, Instant\u003e = HashMap::new();\n    let mut filter_cooldowns: HashMap\u003cPathBuf, Instant\u003e = HashMap::new();\n    let mut stuck_push_repos = load   assert_eq!(normalized_dir_name(\"Target\"), \"target\");\n        assert_eq!(normalized_dir_name(\".tmp-123\"), \".tmp-123\");\n    }\n\n    #[test]\n    fn test_is_excluded_dir_name_exact() {\n        let excluded: BTreeSet\u003cString\u003e = [\"target\", \"node_modules\", \".cache\"]\n            .iter()\n            .map(|s| s.to_string())\n            .collect();\n\n        assert!(is_excluded_dir_name(\"target\", \u0026excluded));\n        assert!(is_excluded_dir_name(\"node_modules\", \u0026excluded));\n        assert!(is_excluded_dir_name(\".cache\", \u0026excluded));\n        assert!(!is_excluded_dir_name(\"src\", \u0026excluded));\n    }\n\n    #[test]\n    fn test_is_excluded_dir_name_pattern() {\n        let excluded: BTreeSet\u003cString\u003e = [\".tmp-\".to_string()].into_iter().collect();\n\n        assert!(is_excluded_dir_name(\".tmp-abc\", \u0026excluded));\n        assert!(is_excluded_dir_name(\".tmp-123\", \u0026excluded));\n    }\n\n    #[test]\n    fn test_excluded_dir_names_set() {\n        let policy = SyncPolicy {\n            exclude_dir_names: vec![\n                \"target\".to_string(),\n                \"/node_modules/\".to_string(),\n                \".cache\".to_string(),\n            ],\n            ..Default::default()\n        };\n\n        let set = excluded_dir_names_set(\u0026policy);\n        assert!(set.contains(\"target\"));\n        assert!(set.contains(\"node_modules\"));\n        assert!(set.contains(\".cache\"));\n        assert_eq!(set.len(), 3);\n    }\n\n    #[test]\n    fn test_excluded_dir_names_set_removes_empty() {\n        let policy = SyncPolicy {\n            exclude_dir_names: vec![\"target\".to_string(), \"\".to_string(), \"   \".to_string()],\n            ..Default::default()\n        };\n\n        let set = excluded_dir_names_set(\u0026policy);\n        assert!(set.contains(\"target\"));\n        assert!(!set.contains(\"\"));\n    }\n}\n\nimpl Default for SyncPolicy {\n    fn default() -\u003e Self {\n        SyncPolicy {\n            system_repo: String::new(),\n            pulse_interval_secs: 1,\n            inactivity_push_delay_secs: 5,\n            auto_commit: true,\n            auto_bump_versions: true,\n            auto_pull: true,\n            auto_push: true,\n            backup_policy: String::new(),\n            backup_dir: String::new(),\n            exclude_repos: vec![],\n            exclude_dir_names: vec![],\n            exclude_file_patterns: vec![],\n            auto_repair_concerns: true,\n            auto_repair_warns: true,\n            auto_rewrite_large_blobs: true,\n            watch_roots: vec![],\n            extra_remotes: vec![],\n            auto_github_private: false,\n            auto_github_private_account: \"DraconDev\".to_string(),\n            max_stage_file_bytes: 100 * 1024 * 1024,\n            pull_op_timeout_secs: 30,\n            push_op_timeout_secs: 300,\n            repo_sync_timeout_secs: 420,\n            push_retries: 3,\n            repair_cooldown_secs: 60,\n            max_push_blob_bytes: 100 * 1024 * 1024,\n            incident_ledger_max_lines: 10_000,\n            incident_ledger_max_age_days: 30,\n        }\n    }\n}\n\npub(crate) fn is_excluded_dir_name(name: \u0026str, excluded_dir_names: \u0026BTreeSet\u003cString\u003e) -\u003e bool {\n    let normalized = normalized_dir_name(name);\n    for pattern in excluded_dir_names {\n        if *pattern == normalized {\n            return true;\n        }\n        if pattern.ends_with('-')\n            \u0026\u0026 pattern.starts_with('.')\n            \u0026\u0026 normalized.starts_with(\u0026pattern[..pattern.len() - 1])\n        {\n            return true;\n        }\n        if pattern.ends_with('*') \u0026\u0026 normalized.starts_with(\u0026pattern[..pattern.len() - 1]) {\n            return true;\n        }\n    }\n    false\n}\n\npub(crate) fn is_excluded_change_path(path: \u0026Path, excluded_dir_names: \u0026BTreeSet\u003cString\u003e) -\u003e bool {\n    path.components()\n        .filter_map(|c| c.as_os_str().to_str())\n        .any(|name| is_excluded_dir_name(name, excluded_dir_names))\n}\n\npub(crate) fn matches_file_pattern(file_name: \u0026str, pattern: \u0026str) -\u003e bool {\n    if pattern == file_name {\n        return true;\n    }\n    if pattern.starts_with(\"*.\") {\n        let ext = \u0026pattern[1..];\n        if file_name.ends_with(ext) {\n            return true;\n        }\n    }\n    if pattern.ends_with(\".*\") {\n        let prefix = \u0026pattern[..pattern.len() - 1];\n        if file_name.starts_with(prefix) {\n            return true;\n        }\n    }\n    if pattern.contains('*') {\n        let parts: Vec\u003c\u0026str\u003e = pattern.split('*').collect();\n        if parts.len() == 2 {\n            let (prefix, suffix) = (parts[0], parts[1]);\n            if file_name.starts_with(prefix) \u0026\u0026 file_name.ends_with(suffix) {\n                return true;\n            }\n        }\n    }\n    false\n}\n\npub(crate) fn is_excluded_file(file_path: \u0026Path, excluded_patterns: \u0026[String]) -\u003e bool {\n    let file_name = file_path.file_name().and_then(|n| n.to_str()).unwrap_or(\"\");\n\n    for pattern in excluded_patterns {\n        if matches_file_pattern(file_name, pattern) {\n            return true;\n        }\n    }\n    false\n}\n\n/// Check if a path is a gitlink (mode 160000) with an unchanged pointer.\n/// Returns true if the entry is a submodule-like directory whose HEAD commit\n/// matches what the parent repo tracks, meaning the \"dirty\" state is just\n/// the submodule's own working tree being dirty (not a pointer change).\npub(crate) fn is_gitlink_unchanged(repo: \u0026Path, path: \u0026Path) -\u003e bool {\n    let output = std::process::Command::new(\"git\")\n        .current_dir(repo)\n        .args([\"ls-tree\", \"HEAD\", \"--\"])\n        .arg(path)\n        .output();\n    let Ok(out) = output else { return false };\n    let stdout = String::from_utf8_lossy(\u0026out.stdout);\n    // Format: \"160000 commit \u003csha\u003e\\t\u003cpath\u003e\"\n    if !stdout.starts_with(\"160000 \") {\n        return false;\n    }\n    let Some(sha) = stdout.split_whitespace().nth(2) else {\n        return false;\n    };\n    // Check if the submodule's current HEAD matches the tracked sha\n    let sub_output = std::process::Command::new(\"git\")\n        .current_dir(repo.join(path))\n        .args([\"rev-parse\", \"HEAD\"])\n        .output();\n    let Ok(sub_out) = sub_output else {\n        return false;\n    };\n    let sub_sha = String::from_utf8_lossy(\u0026sub_out.stdout).trim().to_string();\n    sub_sha == sha\n}\n\npub(crate) fn should_stage_entry(\n    repo: \u0026Path,\n    entry: \u0026dracon_git::types::DiffFile,\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n    excluded_file_patterns: \u0026[String],\n    max_stage_file_bytes: u64,\n) -\u003e bool {\n    if is_excluded_change_path(\u0026entry.path, excluded_dir_names) {\n        return false;\n    }\n\n    if is_excluded_file(\u0026entry.path, excluded_file_patterns) {\n        return false;\n    }\n\n    let full_path = repo.join(\u0026entry.path);\n\n    // Skip staging entries that live inside a nested git repo.\n    // The nested repo has its own daemon managing it — staging its files from\n    // the parent creates a conflict where both daemons fight over the same tree.\n    let current_repo_git = repo.join(\".git\");\n    if let Some(nested) = is_nested_git_repo_path(\u0026full_path, \u0026current_repo_git) {\n        eprintln!(\n            \"ℹ️ skip {}: nested git repo detected ({}) — managed by its own daemon\",\n            full_path.display(),\n            nested.display()\n        );\n        return false;\n    }\n\n    // Submodules and directory type changes\n    if matches!(entry.status, dracon_git::types::FileStatus::TypeChange) {\n        return true;\n    }\n\n    match std::fs::metadata(\u0026full_path) {\n        Ok(meta) if meta.is_file() =\u003e {\n            if meta.len() \u003e max_stage_file_bytes {\n                eprintln!(\n                    \"ℹ️ skip large file {} ({} bytes \u003e {} bytes)\",\n                    full_path.display(),\n                    meta.len(),\n                    max_stage_file_bytes\n                );\n                return false;\n            }\n            true\n        }\n        Ok(meta) if meta.is_dir() =\u003e {\n            // Skip gitlink entries with unchanged pointers (dirty submodule\n            // working trees that don't represent a pointer change)\n            if is_gitlink_unchanged(repo, \u0026entry.path) {\n                return false;\n            }\n            true\n        }\n        Ok(_) =\u003e true,\n        Err(_) =\u003e {\n            // File doesn't exist on disk\n            if matches!(entry.status, dracon_git::types::FileStatus::Deleted) {\n                // Deleted files should be staged - they don't exist on disk by definition\n                true\n            } else {\n                // File doesn't exist and isn't a deletion - don't stage\n                // This handles partial checkouts or files that were never there\n                false\n            }\n        }\n    }\n}\n\npub(crate) fn can_restore_entry(repo: \u0026Path, entry: \u0026dracon_git::types::DiffFile) -\u003e bool {\n    use dracon_git::types::FileStatus;\n    if !matches!(\n        entry.status,\n        FileStatus::Modified | FileStatus::TypeChange | FileStatus::Renamed\n    ) {\n        return false;\n    }\n    let full_path = repo.join(\u0026entry.path);\n    let current_repo_git = repo.join(\".git\");\n    is_nested_git_repo_path(\u0026full_path, \u0026current_repo_git).is_none()\n}\n\npub(crate) fn is_large_untracked(\n    entry: \u0026dracon_git::types::DiffFile,\n    repo: \u0026Path,\n    threshold: u64,\n) -\u003e bool {\n    use dracon_git::types::FileStatus;\n    if entry.status != FileStatus::Added {\n        return false;\n    }\n    let full_path = repo.join(\u0026entry.path);\n    let current_repo_git = repo.join(\".git\");\n    if is_nested_git_repo_path(\u0026full_path, \u0026current_repo_git).is_some() {\n        return false;\n    }\n    match std::fs::metadata(\u0026full_path) {\n        Ok(meta) if meta.is_file() =\u003e meta.len() \u003e threshold,\n        _ =\u003e false,\n    }\n}\n\npub(crate) fn append_to_gitignore(repo: \u0026Path, patterns: \u0026[String]) -\u003e Result\u003c()\u003e {\n    let gitignore = repo.join(\".gitignore\");\n    let current = std::fs::read_to_string(\u0026gitignore).unwrap_or_default();\n\n    let mut lines: Vec\u003cString\u003e = current.lines().map(String::from).collect();\n    let mut added = Vec::new();\n\n    for pattern in patterns {\n        let pattern_line = pattern.trim();\n        if pattern_line.is_empty() || lines.iter().any(|l| l.trim() == pattern_line) {\n            continue;\n        }\n        added.push(pattern_line.to_string());\n    }\n\n    if added.is_empty() {\n        return Ok(());\n    }\n\n    // Check if there's a warden-managed block\n    let block_begin_idx = lines\n        .iter()\n        .position(|l| l.contains(\"--- BEGIN DRACON MANAGED BLOCK ---\"));\n    let block_end_idx = lines\n        .iter()\n        .position(|l| l.contains(\"--- END DRACON MANAGED BLOCK ---\"));\n\n    if let (Some(begin_idx), Some(end_idx)) = (block_begin_idx, block_end_idx) {\n        // Warden manages this .gitignore - insert patterns INSIDE the managed block\n        // (before the END marker) so warden will preserve them\n        let insert_at = end_idx;\n\n        // Check if we already have a large files section inside the managed block\n        let has_large_files_section = lines[begin_idx..end_idx]\n            .iter()\n            .any(|l| l.contains(\"# Large files (auto-added by dracon-sync)\"));\n\n        let mut to_insert = Vec::new();\n        if !has_large_files_section {\n            to_insert.push(\"# Large files (auto-added by dracon-sync)\".to_string());\n        }\n        for pattern in \u0026added {\n            to_insert.push(pattern.clone());\n        }\n\n        // Insert before the END marker\n        for (i, line) in to_insert.into_iter().enumerate() {\n            lines.insert(insert_at + i, line);\n        }\n\n        let new_content = lines.join(\"\\n\");\n        std::fs::write(\u0026gitignore, new_content)?;\n\n        eprintln!(\n            \"📝 added {} large file pattern(s) to .gitignore in {} (inside warden managed block)\",\n            added.len(),\n            repo.display()\n        );\n\n        return Ok(());\n    }\n\n    // No warden block - we can safely append\n    // Check if we already have a large files section\n    let has_large_files_section = lines\n        .iter()\n        .any(|l| l.contains(\"# Large files (auto-added by dracon-sync)\"));\n\n    // Build the new lines to append\n    let mut to_append = Vec::new();\n    if !has_large_files_section {\n        to_append.push(String::new()); // blank line\n        to_append.push(\"# Large files (auto-added by dracon-sync)\".to_string());\n    }\n    for pattern in added {\n        to_append.push(pattern);\n    }\n\n    // Append to the end\n    lines.extend(to_append);\n\n    let new_content = lines.join(\"\\n\");\n    std::fs::write(\u0026gitignore, new_content)?;\n\n    Ok(())\n}\n\n/// Handle large untracked files by adding them to .gitignore.\n/// Returns true if .gitignore was updated.\npub(crate) fn handle_large_untracked(\n    repo: \u0026Path,\n    to_restore: \u0026[dracon_git::types::DiffFile],\n    policy: \u0026SyncPolicy,\n) -\u003e Result\u003cbool\u003e {\n    let large_untracked: Vec\u003c_\u003e = to_restore\n        .iter()\n        .filter(|e| is_large_untracked(e, repo, policy.max_stage_file_bytes))\n        .collect();\n\n    if large_untracked.is_empty() {\n        return Ok(false);\n    }\n\n    let patterns: Vec\u003cString\u003e = large_untracked\n        .iter()\n        .map(|e| e.path.to_string_lossy().to_string())\n        .collect();\n    eprintln!(\n        \"📝 {} has {} large untracked file(s) \u003e {} bytes - adding to .gitignore\",\n        repo.display(),\n        patterns.len(),\n        policy.max_stage_file_bytes\n    );\n    append_to_gitignore(repo, \u0026patterns)?;\n    Ok(true)\n}\n\n/// Common build / generated output directory names that should never be tracked.\n/// These are checked IN ADDITION to exclude_dir_names to catch directories\n/// that aren't in the standard exclusion list but are clearly build artifacts.\nfn is_build_output_dir_name(name: \u0026str) -\u003e bool {\n    matches!(\n        name,\n        \".output\" | \".out\" | \"output\" | \"bin\" | \"obj\" | \"generated\" | \"gen\" | \".next\" | \"dist-new\"\n    ) || name.ends_with(\".output\")\n        || name.ends_with(\"_output\")\n        || name.starts_with(\"output-\")\n}\n\n/// Find tracked files that live inside excluded directories or common build\n/// output directories. These should never have been committed (build artifacts,\n/// generated files, etc.). Removes them from git tracking and adds the directory\n/// patterns to .gitignore.\npub(crate) fn remove_tracked_excluded_paths(\n    repo: \u0026Path,\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n) -\u003e Result\u003cOption\u003cVec\u003cString\u003e\u003e\u003e {\n    let output = std::process::Command::new(\"git\")\n        .current_dir(repo)\n        .args([\"ls-files\", \"-z\"])\n        .output()?;\n    if !output.status.success() {\n        return Ok(None);\n    }\n    let files: Vec\u003cString\u003e = String::from_utf8_lossy(\u0026output.stdout)\n        .split('\\0')\n        .filter(|s| !s.is_empty())\n        .map(String::from)\n        .collect();\n\n    let mut top_level_excluded: BTreeSet\u003cString\u003e = BTreeSet::new();\n    let mut to_remove: Vec\u003cString\u003e = Vec::new();\n\n    for file in \u0026files {\n        let path = Path::new(file);\n        let mut found_excluded = false;\n\n        // Check standard excluded dir names\n        if is_excluded_change_path(path, excluded_dir_names) {\n            for component in path.components() {\n                let name = component.as_os_str().to_str().unwrap_or(\"\");\n                if is_excluded_dir_name(name, excluded_dir_names) {\n                    top_level_excluded.insert(name.to_string());\n                    found_excluded = true;\n                    break;\n                }\n            }\n        }\n\n        // Also detect common build output directories\n        if !found_excluded {\n            for component in path.components() {\n                let name = component.as_os_str().to_str().unwrap_or(\"\");\n                if is_build_output_dir_name(name) {\n                    top_level_excluded.insert(name.to_string());\n                    found_excluded = true;\n                    break;\n                }\n            }\n        }\n\n        if found_excluded {\n            to_remove.push(file.to_string());\n        }\n    }\n\n    if to_remove.is_empty() {\n        return Ok(None);\n    }\n\n    let patterns: Vec\u003cString\u003e = top_level_excluded\n        .iter()\n        .map(|d| format!(\"{}/\", d))\n        .collect();\n    eprintln!(\n        \"📝 {} has {} tracked file(s) inside build-artifact dirs {:?} — removing from git and adding to .gitignore\",\n        repo.display(),\n        to_remove.len(),\n        patterns\n    );\n\n    append_to_gitignore(repo, \u0026patterns)?;\n\n    for chunk in to_remove.chunks(50) {\n        let mut args = vec![\"rm\", \"-q\", \"--cached\", \"--\"];\n        for f in chunk {\n            args.push(f);\n        }\n        let status = std::process::Command::new(\"git\")\n            .current_dir(repo)\n            .args(\u0026args)\n            .status()?;\n        if !status.success() {\n            eprintln!(\n                \"⚠️ git rm --cached failed for some files in {}\",\n                repo.display()\n            );\n        }\n    }\n\n    Ok(Some(top_level_excluded.into_iter().collect()))\n}\n\npub(crate) fn has_sync_relevant_dirty_entries(\n    repo: \u0026Path,\n    entries: \u0026[dracon_git::types::DiffFile],\n    excluded_dir_names: \u0026BTreeSet\u003cString\u003e,\n    excluded_file_patterns: \u0026[String],\n    max_stage_file_bytes: u64,\n) -\u003e bool {\n    let current_repo_git = repo.join(\".git\");\n    entries.iter().any(|entry| {\n        let full_path = repo.join(\u0026entry.path);\n\n        // Skip entries inside nested git repos — managed by their own daemon\n        if is_nested_git_repo_path(\u0026full_path, \u0026current_repo_git).is_some() {\n            return false;\n        }\n\n        // Skip gitlink entries with unchanged pointers entirely\n        // Use repo.join() because entry.path is relative to repo, not CWD\n        if full_path.is_dir() \u0026\u0026 is_gitlink_unchanged(repo, \u0026entry.path) {\n            return false;\n        }\n        should_stage_entry(\n            repo,\n            entry,\n            excluded_dir_names,\n            excluded_file_patterns,\n            max_stage_file_bytes,\n        ) || can_restore_entry(repo, entry)\n            || is_large_untracked(entry, repo, max_stage_file_bytes)\n    })\n}\n","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":16}},{"line":10,"address":[],"length":0,"stats":{"Line":32}},{"line":13,"address":[],"length":0,"stats":{"Line":2}},{"line":14,"address":[],"length":0,"stats":{"Line":2}},{"line":15,"address":[],"length":0,"stats":{"Line":2}},{"line":17,"address":[],"length":0,"stats":{"Line":14}},{"line":18,"address":[],"length":0,"stats":{"Line":14}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"
