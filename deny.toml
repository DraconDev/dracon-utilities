# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = false

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = [
    { crate = "base64@0.21", reason = "age (encryption) uses old version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
# Note: previously listed "https://github.com/DraconDev/dracon-libs" but the
# workspace depends on it via a local path, not git. Removed as dead config.

[licenses]
confidence-threshold = 0.80
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]
private = { ignore = true }
exceptions = [
    # icu4x crates use (MIT OR Apache-2.0) AND Unicode-3.0
    { allow = ["Unicode-3.0"], crate = "icu_collections" },
    { allow = ["Unicode-3.0"], crate = "icu_locale_core" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer_data" },
    { allow = ["Unicode-3.0"], crate = "icu_properties" },
    { allow = ["Unicode-3.0"], crate = "icu_properties_data" },
    { allow = ["Unicode-3.0"], crate = "icu_provider" },
    { allow = ["Unicode-3.0"], crate = "litemap" },
    { allow = ["Unicode-3.0"], crate = "potential_utf" },
    { allow = ["Unicode-3.0"], crate = "tinystr" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    { allow = ["Unicode-3.0"], crate = "writeable" },
    { allow = ["Unicode-3.0"], crate = "yoke" },
    { allow = ["Unicode-3.0"], crate = "yoke-derive" },
    { allow = ["Unicode-3.0"], crate = "zerofrom" },
    { allow = ["Unicode-3.0"], crate = "zerofrom-derive" },
    { allow = ["Unicode-3.0"], crate = "zerotrie" },
    { allow = ["Unicode-3.0"], crate = "zerovec" },
    { allow = ["Unicode-3.0"], crate = "zerovec-derive" },
]
