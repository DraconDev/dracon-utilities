name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  DRACON_SYNC_GIT_BIN: /usr/bin/git

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dracon-libs
        run: git clone https://github.com/DraconDev/dracon-libs.git ../dracon-libs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -p dracon-sync -p dracon-system -p dracon-warden -- --check

      - name: Clippy
        run: cargo clippy -p dracon-sync -p dracon-system -p dracon-warden -- -D clippy::all -D clippy::correctness

      - name: Build
        run: cargo build -p dracon-sync -p dracon-system -p dracon-warden

      - name: Test (serial)
        run: cargo test -p dracon-sync -p dracon-system -p dracon-warden -- --test-threads=1
