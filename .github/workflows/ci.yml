name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 06:00 UTC — catches dependency breakage
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  DRACON_SYNC_GIT_BIN: /usr/bin/git

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all lints)
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Docs (strict)
        run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --workspace --locked

      - name: Test (serial)
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Test (release profile)
        run: cargo test --workspace --release --locked -- --test-threads=1

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Check binary sizes
        run: |
          for bin in dracon-sync dracon-system dracon-warden; do
            size=$(stat --format=%s target/release/$bin)
            mb=$((size / 1024 / 1024))
            echo "$bin: ${mb}MiB"
            # Flag if any binary exceeds 25 MiB (regression check)
            if [ "$mb" -gt 25 ]; then
              echo "⚠️ $bin is larger than 25 MiB (${mb} MiB)"
              exit 1
            fi
          done

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        # FIXED 2026-09-27 (audit F86): the glob only covered root
        # scripts/*.sh, so the per-crate scripts AGENTS.md references
        # (e.g. dracon-sync/scripts/verify-install.sh, wired into
        # dracon-sync/scripts/release.sh step 7) were never linted.
        run: shellcheck install.sh uninstall.sh doctor.sh scripts/*.sh dracon-*/scripts/*.sh

      - name: Unit-deployment checker regression suites
        # ADDED 2026-10-02 (audit M9): the drift checkers are worthless if
        # their suites never run. Both suites are hermetic (isolated HOME,
        # stubbed systemctl/systemd-analyze; the no-bus cases take the
        # documented exit-0 skip path on a runner with no user manager).
        shell: bash
        run: |
          ./dracon-sync/scripts/test_check_unit_deployment.sh
          ./dracon-system/scripts/test_check_unit_deployment.sh

      - name: Script dry-run (install.sh)
        # FIXED 2026-09-27 (audit F86, rework round 2): removing the
        # `|| true` was NOT enough. Under GitHub's default shell
        # (`bash -e`, no pipefail) the pipeline's exit status is that of
        # the LAST command — `head` — which is always 0, so
        # `install.sh --help 2>&1 | head -1` still asserted nothing.
        # `shell: bash` runs `bash --noprofile --norc -eo pipefail {0}`,
        # so the pipeline now fails when install.sh does.
        shell: bash
        run: |
          bash -n install.sh
          bash install.sh --help 2>&1 | head -1

      - name: Script dry-run (uninstall.sh, doctor.sh)
        # Same pipefail requirement as the install.sh step above.
        shell: bash
        run: |
          bash -n uninstall.sh
          bash -n doctor.sh
          ./doctor.sh

      - name: Parent audit regression tests
        run: python3 -m unittest -v scripts.tests.test_audit_regressions

      - name: Verify nested source pins
        # RESTORED 2026-09-27 (audit decision D1). This gate was removed
        # in the 2026-08-22 monorepo conversion along with the `*-src`
        # flake inputs it checked, and never came back — so the 21 floating
        # `ref: main` checkouts and the flake.lock pins drifted apart
        # unnoticed, and CI kept building whatever the mirror happened to
        # hold. It is meaningful again now that all three agree.
        #
        # --check-local additionally asserts each checked-out nested repo's
        # HEAD equals its pin, which is what makes this a real gate: the
        # checkouts above are pinned, so a pin/lockfile/manifest mismatch
        # fails here rather than producing a silently wrong build.
        run: python3 scripts/check-nested-pins.py --check-local

      - name: Verify the documented spec contract
        # UNBLOCKED 2026-09-27 (audit decision D1): this was left unwired
        # because its only failing invariant was "Nested source pins", which
        # the model change of 2026-09-11 had left unsatisfiable. The pins
        # exist again, so the whole contract can be enforced.
        run: ./scripts/verify-spec.sh


  msrv:
    name: Minimum Toolchain
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden


      - name: Install the declared MSRV
        # FIXED 2026-09-27 (audit F84): this job was named "Minimum
        # Toolchain" but installed `stable` — the same toolchain as every
        # other job — so no MSRV was enforced anywhere and an upstream MSRV
        # bump passed CI silently. It now installs the version declared as
        # `rust-version` in the crate manifests (1.89).
        #
        # CORRECTED 2026-09-27 (auditor, rework rounds 1 and 4): this
        # comment used to claim only that the workspace "builds" on
        # 1.89.0, which is a build-only statement backing a
        # `-D warnings` clippy gate. It also claimed the job was green on
        # arrival, which was false: pinning 1.89.0 exposes six lints that
        # stable 1.97.1 does not report, so this change turned a green job
        # red. All six are now fixed at source
        # (dracon-warden security/src/lib.rs only_used_in_recursion;
        # dracon-system links.rs + main.rs collapsible_else_if;
        # dracon-sync exclude.rs unused bindings, daemon.rs + sync.rs
        # nonminimal_bool). Verified on the PINNED toolchain, not stable:
        #   cargo +1.89.0 clippy --workspace --locked --all-targets -- -D warnings
        #   cargo +1.89.0 clippy --workspace --locked --all-targets --all-features -- -D warnings
        # both exit 0.
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Clippy (MSRV, minimal features)
        # Previously a byte-identical duplicate of the step above, so it
        # asserted nothing. It now covers the test/bench/example targets,
        # which the default-target clippy pass never sees.
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check all deny policies
        # FIXED 2026-09-27 (audit F83): only advisories/licenses/bans ran,
        # so deny.toml's `[sources] unknown-git = "deny"` /
        # `unknown-registry = "deny"` policy was never enforced — and
        # AGENTS.md's test discipline is plain `cargo deny check`.
        # Verified locally: "advisories ok, bans ok, licenses ok, sources ok".
        run: cargo deny check

      # NOTE (2026-09-27): `scripts/verify-spec.sh` is NOT wired in yet.
      # Its only failing invariant is "Nested source pins", which encodes
      # the pre-2026-09-11 nested-standalone-in-flake model. Adding it now
      # would turn CI red for a question that is still open, so it is
      # raised as an operator decision instead. See the 2026-09-27 audit
      # pass in .pi-glla/audit-loop/findings.md.

  nix:
    name: Nix Flake
    runs-on: ubuntu-latest
    steps:
      # RESTORED 2026-09-27 (auditor, round 1): this is the PARENT
      # repository, not a duplicate. Removing it as "redundant" left every
      # job running in a directory holding only the three utility checkouts, so
      # the workspace Cargo.toml, install.sh, scripts/ and flake.nix were all
      # absent and every step below failed.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: 03504c3d13dde629f70edf031d93a27f1900396f
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: 493e8febcfd401dc6b7d54be06b32e5f66eb6b99
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: a54e4c6fb3716ffb3bedf00ce1f457f6ee786ffd
          path: dracon-warden

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Verify ignored files stay outside the Nix source
        run: python3 -m unittest -v scripts.tests.test_audit_regressions.NixSourceIsolation

      - name: Check flake evaluates
        run: ./scripts/check-flake.sh

      - name: Build the default package
        # ADDED 2026-09-27 (audit decision D1). This job previously ran
        # ONLY `nix flake check --no-build`, which evaluates derivations
        # but never realises one. That is precisely why the 2026-08-22
        # monorepo conversion went unnoticed: `mergedSrc` was built from
        # ${self}, which has contained no utility source since 2026-09-11,
        # so every `nix build` failed while CI stayed green on evaluation
        # alone. Realising the default package is the assertion that
        # actually proves the flake can build the utilities.
        run: nix build .#default --no-link
