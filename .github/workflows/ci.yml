name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 06:00 UTC — catches dependency breakage
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  DRACON_SYNC_GIT_BIN: /usr/bin/git

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all lints)
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Docs (strict)
        run: cargo doc --workspace --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --workspace --locked

      - name: Test (serial)
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Test (release profile)
        run: cargo test --workspace --release --locked -- --test-threads=1

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Check binary sizes
        run: |
          for bin in dracon-sync dracon-system dracon-warden; do
            size=$(stat --format=%s target/release/$bin)
            mb=$((size / 1024 / 1024))
            echo "$bin: ${mb}MiB"
            # Flag if any binary exceeds 25 MiB (regression check)
            if [ "$mb" -gt 25 ]; then
              echo "⚠️ $bin is larger than 25 MiB (${mb} MiB)"
              exit 1
            fi
          done

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck install.sh uninstall.sh doctor.sh scripts/*.sh

      - name: Script dry-run (install.sh)
        run: |
          # Verify install.sh can at least parse its args without errors
          bash -n install.sh
          bash install.sh --help 2>&1 | head -1 || true

      - name: Script dry-run (doctor.sh)
        run: bash -n doctor.sh

  msrv:
    name: Minimum Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden


      - name: Install the declared MSRV
        # FIXED 2026-09-27 (audit F84): this job was named "Minimum
        # Toolchain" but installed `stable` — the same toolchain as every
        # other job — so no MSRV was enforced anywhere and an upstream MSRV
        # bump passed CI silently. It now installs the version declared as
        # `rust-version` in the crate manifests (1.89, verified by building
        # the whole workspace with --all-targets on 1.89.0).
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Clippy (MSRV, minimal features)
        # Previously a byte-identical duplicate of the step above, so it
        # asserted nothing. It now covers the test/bench/example targets,
        # which the default-target clippy pass never sees.
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check all deny policies
        # FIXED 2026-09-27 (audit F83): only advisories/licenses/bans ran,
        # so deny.toml's `[sources] unknown-git = "deny"` /
        # `unknown-registry = "deny"` policy was never enforced — and
        # AGENTS.md's test discipline is plain `cargo deny check`.
        # Verified locally: "advisories ok, bans ok, licenses ok, sources ok".
        run: cargo deny check

      - name: Verify the documented spec contract
        run: ./scripts/verify-spec.sh

  nix:
    name: Nix Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-sync-background-auto-commit-multi-remote
          ref: main
          path: dracon-sync
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-system-disk-process-guard-doctor
          ref: main
          path: dracon-system
      - uses: actions/checkout@v4
        with:
          repository: DraconDev/dracon-warden-secret-encrypt-age-git-filter
          ref: main
          path: dracon-warden

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Check flake evaluates
        run: ./scripts/check-flake.sh
